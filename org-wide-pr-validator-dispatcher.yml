# ORG-WIDE PR-VALIDATOR DISPATCHER — install at .github/workflows/pr-validator.yml
#
# Triggers on pull_request events, calls the reusable validator in
# opencharly/.github which reviews the PR, renames the CHANGELOG, and
# enables native auto-merge on PASS.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: charly/pr-validator
    if: github.event.pull_request.head.repo.fork == false
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
