# ORG-WIDE TAG-ON-MERGE DISPATCHER — install at .github/workflows/tag-on-merge.yml
#
# Triggers on pull_request:closed, calls the reusable tag creator in
# opencharly/.github which creates the CalVer release tag on the merge commit.
name: tag-on-merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    uses: opencharly/.github/.github/workflows/tag-on-merge.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
