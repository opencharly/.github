# ORG-WIDE AUTO-MERGE DISPATCHER — install at .github/workflows/auto-merge.yml
#
# Fires when charly/pr-validator completes successfully on any PR.
# Calls the reusable auto-merge engine in opencharly/.github.
name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  engine:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    uses: opencharly/.github/.github/workflows/auto-merge-reusable.yml@main
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
