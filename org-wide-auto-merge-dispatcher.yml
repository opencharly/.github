# ORG-WIDE AUTO-MERGE DISPATCHER — install at .github/workflows/auto-merge.yml
name: auto-merge

on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head-sha:
        description: SHA of the PR head to merge
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
 Actions: write

jobs:
  engine:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != github.event.repository.default_branch) ||
      (github.event_name == 'check_run' && github.event.check_run.check_suite.head_branch != github.event.repository.default_branch)
    uses: opencharly/.github/.github/workflows/auto-merge-reusable.yml@main
    with:
      head-sha: ${{ inputs.head-sha || github.event.check_run.check_suite.head_sha || github.event.workflow_run.head_sha }}
    secrets: inherit
