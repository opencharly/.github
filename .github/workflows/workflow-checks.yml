# Static policy checks and live Node/action artifact boundaries.
name: workflow-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: workflow-checks
    # A FORK PR runs untrusted code. It never lands on the fleet: our runners are long-lived
    # and keep state between jobs, so a fork PR would execute attacker-controlled code on them.
    # Own-code PRs, pushes and dispatches take the fleet; a fork PR stays on GitHub-hosted.
    runs-on: ${{ (github.event.pull_request.head.repo.fork == true) && 'ubuntu-latest' || (vars.CI_RUNNER_LABEL || 'ubuntu-latest') }}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24
      - name: "Run the image-build tag-derivation test (offline, extracted step text)"
        run: bash scripts/image-build-tag_test.sh
      - name: Run the org-ruleset owner-script test (offline, mock gh)
        run: bash scripts/org-ruleset_test.sh
      - name: Run the dispatcher-retirement script test (offline, mock gh)
        run: bash scripts/retire-per-repo-dispatchers_test.sh
      - name: Run the candy-gate-retirement script test (offline, mock gh)
        run: bash scripts/retire-per-repo-candy-gates_test.sh
      - name: Run the version-strip cutover script test (offline, mock gh)
        run: bash scripts/strip-config-version_test.sh
      # The head-settle gate lives INSIDE the reusable workflow and runs in the
      # CALLER's repository, so it cannot be a script here: the test EXTRACTS the
      # shipped step's `run:` text and runs THAT against fixtures. It is the only
      # coverage the settle logic has — without it, a regression in the merge
      # guardrail is found in the org instead of here.
      - name: Run the head-settle gate test (offline, extracted step text)
        run: bash scripts/head-settle_test.sh
      # The retired-sweep arm lives INSIDE the reusable workflow and runs in the
      # CALLER's repository, so it cannot be a script here for the same reason the
      # settle gate cannot: the coverage EXTRACTS the shipped step's `run:` text
      # and runs THAT against fixtures. The sweep it runs is the CONTRACT's own Go
      # command, so the harness needs a Go toolchain. The version is an EXACT
      # patch, never 'stable' — the same rule and the same measurement as the
      # `lint` job's setup-go (RCA 2026-10-09, opencharly/pod-github-runner#9),
      # and 1.26.4 is the one already present in every runner's tool cache, so
      # it costs no download. It is not read from the contract's go.mod because
      # the contract is cloned INSIDE the test, after this step, and
      # `go-version-file` cannot point at a file that does not exist yet. The
      # module cache is off for the same reason: the dependency file it would key
      # on is the contract's go.sum, which this repository does not have.
      #
      # THIS STEP NEEDS THE NETWORK, and it is labelled as such rather than
      # "offline": the coverage clones the contract at the tag the shipped step
      # pins, from GitHub, because the executable under test IS the contract's Go
      # command — the thing the arm runs is the thing this runs. Every other
      # step in this job is offline; this one reads a public repository, and a
      # label that hid that would misstate what the job does.
      - name: Set up Go (the retired-sweep arm's coverage is a Go command)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, node24
        with:
          go-version: '1.26.4'
          cache: false
      - name: "Run the retired-sweep arm test (network: the pinned contract is cloned; the step text is extracted)"
        run: bash scripts/retired-sweep-arm_test.sh
      # The org-rulebook assert lives INSIDE the reusable workflow too, so its
      # coverage extracts the shipped step's text and runs THAT, the same way.
      # This one is genuinely offline: the step reads the prompt it is HANDED, and
      # the coverage hands it a fixture — the org variable is configuration, not
      # content, and is never copied into the repo.
      - name: Run the org-rulebook assert test (offline, extracted step text)
        run: bash scripts/assert-org-rulebook_test.sh
      # The reconcile script's two dimensions and its repo allow-list. This test existed but
      # nothing ran it: a script whose own coverage is never executed is a script whose
      # regressions are found in the org instead of here.
      - name: Run the tag-on-merge caller-reconcile script test (offline)
        run: bash scripts/reconcile-tag-on-merge-callers_test.sh
      # opencharly/.github#294: the reconcile writes to `main` outside the merge path, so
      # nothing tags its commit — and an untagged head fails design-pintag for every pin
      # that advances to it. This test runs the SHIPPED script against a mock `gh` and
      # asserts the tag is created at the commit the PUT returned.
      - name: Run the reconcile tag-after-write test (offline, mock gh)
        run: bash scripts/reconcile-tag-on-merge-callers_tag_test.sh
      # opencharly/.github#294: the heads the reconcile wrote BEFORE it learned to tag
      # them. This test proves the backfill tags only untagged, unexplained heads, in the
      # per-repo form, and never re-creates an existing tag.
      - name: Run the missing-tag backfill test (offline, mock gh)
        run: bash scripts/backfill-missing-tags_test.sh
      # The DETECTOR that makes an untagged merge loud (opencharly/.github#286).
      # Offline and extracted: the step's shipped `run:` text is run against a mock
      # `gh`, and the RED arms are the point — a detector that cannot fail is not a
      # detector. The structural arm asserts `if: always()`: without it the detector
      # is skipped exactly when the tagging step died.
      - name: Run the tag-on-merge untagged-merge detector test (offline, extracted step text)
        run: bash scripts/tag-on-merge-assert_test.sh
      - name: Check action runtime pins
        run: python3 scripts/check-action-runtimes.py
      - name: Prove the action runtime checker rejects Node 20
        run: python3 scripts/check-action-runtimes.py --self-test
      - name: Exercise the pinned github-script runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, node24
        with:
          script: |
            const major = Number(process.versions.node.split('.')[0]);
            if (major !== 24) core.setFailed(`expected Node 24, got ${process.version}`);
            core.info(`github-script runtime: Node ${process.version}`);
      - name: Prepare upload-artifact runtime smoke
        run: |
          mkdir -p "$RUNNER_TEMP/action-runtime-smoke"
          printf 'Node 24 artifact action smoke\n' > "$RUNNER_TEMP/action-runtime-smoke/result.txt"
      - name: Exercise the pinned upload-artifact runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: action-runtime-smoke
          path: ${{ runner.temp }}/action-runtime-smoke
          if-no-files-found: error
      - name: Run the repo-bootstrap script test (offline, mock gh)
        run: bash scripts/bootstrap-repo-main_test.sh
      - name: Run the governance-reconcile self-test (offline, fixtures)
        run: bash scripts/governance-reconcile.sh --self-test
      - name: Reconcile the governance surfaces (org-wide; skips absent sibling repos)
        # The cross-surface claims (footer order, the 60-min comment-first takeover window,
        # the account-gated sign-off, the successor protocol) must agree
        # across the umbrella AGENTS.md, the git-workflow skill source, the generated
        # marketplace corpus, and this repo's own workflows. Only this repo's surfaces exist
        # in a standalone .github checkout, so the sibling rows SKIP visibly (the run is still
        # non-silent); run with --root <umbrella checkout> to assert every row. A drift
        # reddens the check.
        run: bash scripts/governance-reconcile.sh
