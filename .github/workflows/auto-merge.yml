# ORG-WIDE AUTO-MERGE DISPATCHER — installed in every opencharly repo.
# Calls the single reusable engine in opencharly/.github.
#
# Docs & canonical source: opencharly/.github/.github/workflows/auto-merge-reusable.yml
name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  call-auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    uses: opencharly/.github/.github/workflows/auto-merge-reusable.yml@main
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
