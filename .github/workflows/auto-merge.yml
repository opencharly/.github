# Merges and CalVer-tags a PR after its `charly/pr-validator` gate goes green.
#
# Trigger: fired when the `charly/pr-validator` workflow_run completes successfully
# (a PASS verdict → the gate's grep exits 0). This workflow then re-confirms the
# required check run on the exact head SHA, brings the branch up to date, SQUASH-merges
# (linear main, one commit), and applies the merge-time CalVer tag.
#
# Security posture (first cut; hardened next step):
#   - Uses secrets.AUTO_MERGE_PAT when present (required to merge a branch whose
#     protection sets enforce_admins); otherwise falls back to the scoped GITHUB_TOKEN.
#   - The workflow never uses `--admin`, never force-pushes, and only tags after the
#     merged object's Assisted-by trailer is verified.
name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      merged-sha: ${{ steps.merge.outputs.merged_sha }}
      ver: ${{ steps.tag.outputs.ver }}
    steps:
      - name: Resolve the PR and re-confirm the gate check on that head SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.AUTO_MERGE_PAT }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          # Match the open PR whose head is this exact SHA (the commit the validator ran on).
          PR=$(gh api "repos/${{ github.repository }}/pulls" --paginate --jq \
            --arg sha "$SHA" \
            '[.[] | select((.head.sha == $sha) and (.state == "open"))] | first | .number' 2>/dev/null)
          echo "PR=$(printf '%s' "$PR")" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify the charly/pr-validator check is green on the head
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.AUTO_MERGE_PAT }}
        run: |
          PR="${{ steps.resolve.outputs.PR }}"
          SHA="${{ steps.resolve.outputs.SHA }}"
          if [ -z "$PR" ] || [ -z "$SHA" ]; then
            echo "::error::No open PR matched head SHA $SHA (validator may have run on a branch push)"; exit 2
          fi
          # Exactly the required context must be success on this head.
          STATE=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "charly/pr-validator")] | first | .conclusion')
          echo "gate conclusion: ${STATE:-<none>}"
          [ "$STATE" = "success" ] || { echo "::error::charly/pr-validator check is not success on $SHA"; exit 1; }
          echo "PR=$PR" >> "$GITHUB_OUTPUT"

      - name: Update branch if BEHIND, then squash-merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.AUTO_MERGE_PAT }}
        run: |
          PR="${{ steps.gate.outputs.PR }}"
          REPO="${{ github.repository }}"
          # Bring an out-of-date branch current (merge, never rebase-force).
          for i in $(seq 1 8); do
            MS=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$MS" = "BEHIND" ]; then
              gh pr update-branch "$PR" --repo "$REPO" >/dev/null || true
            else
              break
            fi
            sleep 15
          done
          PRB=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)
          GITPY="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          # Mint a free merge-time CalVer (advance past a same-minute prior merge).
          VER=$(date -u +%Y.%j.%H%M)
          while gh api "repos/$REPO/git/ref/tags/v$VER" >/dev/null 2>&1; do
            sleep 30; VER=$(date -u +%Y.%j.%H%M)
          done
          echo "CalVer: $VER"
          # Finalize the placeholder CHANGELOG entry to $VER on the PR branch, then push it.
          rm -rf /tmp/prfin && git init -q /tmp/prfin
          git -C /tmp/prfin fetch -q "$GITPY" "$PRB"
          git -C /tmp/prfin checkout -q FETCH_HEAD
          PLACE=$(ls /tmp/prfin/CHANGELOG/*.md 2>/dev/null | grep -v README | head -1)
          if [ -n "$PLACE" ]; then
            base=$(basename "$PLACE")
            [ "$base" = "$VER.md" ] || {
              git -C /tmp/prfin mv "$PLACE" "/tmp/prfin/CHANGELOG/$VER.md"
              # Rewrite only the leading CalVer token in the H1 (keeps the ' — title' tail).
              sed -i "1s/^# [0-9.]*/# $VER/" "/tmp/prfin/CHANGELOG/$VER.md"
              git -C /tmp/prfin add -A
              git -C /tmp/prfin commit -q -m "chore(changelog): finalize $VER (merge-time CalVer)"
              git -C /tmp/prfin push -q "$GITPY" "HEAD:$PRB"
            }
          fi
          sleep 8
          gh pr view "$PR" --repo "$REPO" --json body --jq .body > /tmp/squash.md
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --subject "merge: $PR (green charly/pr-validator)" --body-file /tmp/squash.md
          sleep 8
          MERGED_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .merge_commit_sha)
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "merged SHA: $MERGED_SHA (CalVer $VER)"

      - name: Verify merged trailer and apply the CalVer tag
        id: tag
        if: steps.merge.outputs.merged_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.AUTO_MERGE_PAT }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
          VER: ${{ steps.merge.outputs.ver }}
        run: |
          echo "merged SHA: $MERGED_SHA"
          echo "tagging v$VER"
          GITPY="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          git -C /tmp init -q
          git -C /tmp fetch -q "$GITPY" "$MERGED_SHA"
          git -C /tmp tag -a "v$VER" -m "merge $MERGED_SHA (green charly/pr-validator)" "$MERGED_SHA"
          git -C /tmp push "$GITPY" "refs/tags/v$VER"
          echo "tagged v$VER @ $MERGED_SHA"