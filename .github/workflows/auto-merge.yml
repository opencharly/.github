# ORG-WIDE AUTO-MERGE DISPATCHER — .github repo's own instance.
name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  engine:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    uses: ./.github/workflows/auto-merge-reusable.yml
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
