# ORG-WIDE AUTO-MERGE DISPATCHER — .github repo's own instance.
name: auto-merge

on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.check_run.check_suite.head_branch || github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  engine:
    if: >
      (github.event_name == 'pull_request' && github.event.label.name == 'auto-merge') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != github.event.repository.default_branch) ||
      (github.event_name == 'check_run' && github.event.check_run.check_suite.head_branch != github.event.repository.default_branch)
    uses: ./.github/workflows/auto-merge-reusable.yml
    with:
      head-sha: ${{ github.event.check_run.check_suite.head_sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
    secrets: inherit
