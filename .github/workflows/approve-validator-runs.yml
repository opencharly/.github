# ORG-WIDE VALIDATOR-RUN APPROVER
name: approve-validator-runs

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  actions: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "event=${{ github.event.workflow_run.event }}"
          echo "id=${{ github.event.workflow_run.id }}"
          echo "name=${{ github.event.workflow_run.name }}"

  approve:
    if: github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ github.event.workflow_run.id }}';
            await github.rest.actions.approveWorkflowRun({
              ...context.repo,
              run_id: parseInt(runId),
            });
            core.info(`Approved validator run ${runId}`);
