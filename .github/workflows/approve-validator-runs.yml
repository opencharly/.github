# ORG-WIDE VALIDATOR-RUN APPROVER
#
# GITHUB_TOKEN pushes (e.g. the CHANGELOG rename) create
# `pull_request: synchronize` runs in an approval-required state.
# This workflow approves them so the validator re-runs on the PR head
# without manual intervention.
name: approve-validator-runs

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  actions: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            core.info(`Validator run ${{ github.event.workflow_run.id }} concluded: ${conclusion}`);
            if (conclusion !== 'action_required') {
              core.info('Not action_required — nothing to approve');
              return;
            }
            const runId = parseInt('${{ github.event.workflow_run.id }}');
            await github.rest.actions.approveWorkflowRun({
              ...context.repo,
              run_id: runId,
            });
            core.info(`Approved validator run ${runId}`);
