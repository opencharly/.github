# ORG-WIDE AUTO-MERGE ENGINE (reusable via workflow_call)
#
# Called by a thin dispatcher in each target repo.  It finalizes the
# CHANGELOG placeholder, re-triggers the validator on the new head,
# and enables GitHub's native auto-merge — which waits for ALL status
# checks (including the re-run validator) through branch protection.
#
# The engine does NOT poll status checks.  GitHub's native auto-merge
# (`enablePullRequestAutoMerge`) already handles that: it checks ALL
# required branch-protection contexts and only merges when every one
# is passing.  The only polling is a lightweight PR-state loop waiting
# for the merge to complete.
#
# Canonical source: this file.
# Install the dispatcher: opencharly/.github/org-wide-auto-merge-dispatcher.yml
name: auto-merge

on:
  workflow_call:
    inputs:
      head-sha:
        description: SHA of the PR head that triggered this run
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0

      # -- Step 1 — Find the PR, detect state, extract refs -------------------
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: '${{ inputs.head-sha }}',
            });
            const open = prs.find(p => p.state === 'open');
            if (open) {
              core.setOutput('number', String(open.number));
              core.setOutput('state', open.state);
              core.setOutput('head_ref', open.head.ref);
              core.setOutput('base_ref', open.base.ref);
              core.setOutput('node_id', open.node_id);
              core.info(`PR #${open.number} open — ${open.head.ref} → ${open.base.ref}`);
              return;
            }
            const merged = prs.find(p => p.state === 'closed' && p.merge_commit_sha);
            if (merged) {
              core.setOutput('state', 'closed');
              core.setOutput('merge_sha', merged.merge_commit_sha);
              core.setOutput('merge_date', merged.merged_at);
              return;
            }
            core.setFailed('No open PR found for this commit');

      # -- Step 2 — Tag an already-closed PR and exit -------------------------
      - if: steps.pr.outputs.state == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.pr.outputs.merge_sha }}';
            const d = new Date('${{ steps.pr.outputs.merge_date }}');
            const y = d.getUTCFullYear();
            const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
            const hh = String(d.getUTCHours()).padStart(2, '0');
            const mm = String(d.getUTCMinutes()).padStart(2, '0');
            const tag = context.repo.repo === 'sdk'
              ? `v0.${y}${doy}.${parseInt(hh + mm)}`
              : `v${y}.${doy}.${hh}${mm}`;
            try { await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` }); }
            catch { await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha }); }

      # -- Step 3 — Fetch PR base + head branches for the diff ----------------
      - if: steps.pr.outputs.state == 'open'
        run: |
          git fetch origin \
            "+refs/heads/${{ steps.pr.outputs.base_ref }}:refs/remotes/origin/${{ steps.pr.outputs.base_ref }}" \
            "+refs/heads/${{ steps.pr.outputs.head_ref }}:refs/remotes/origin/${{ steps.pr.outputs.head_ref }}"

      # -- Step 4 — CHANGELOG finalization (git operations) -------------------
      - if: steps.pr.outputs.state == 'open'
        id: changelog
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          p=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" -- CHANGELOG/ \
            | awk '$1=="A"{print $NF}' \
            | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
          [ -z "$p" ] && exit 0
          c=$(git show "origin/$HEAD_REF:$p" 2>/dev/null || true)
          echo "$c" | grep -q "auto-merge-finalized: $(basename "$p" .md)" \
            && { echo "stamp=$(basename "$p" .md)" >> "$GITHUB_OUTPUT"; exit 0; }
          stamp=$(date -u +%Y.%j.%H%M)
          [ "$(basename "$p" .md)" = "$stamp" ] \
            && { echo "stamp=$stamp" >> "$GITHUB_OUTPUT"; exit 0; }
          git checkout -q -B dev/auto-merge "origin/$HEAD_REF"
          git mv "$p" "CHANGELOG/$stamp.md"
          sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md"
          git add "CHANGELOG/$stamp.md"
          git -c user.name='opencharly auto-merge' -c user.email='actions@github.com' \
            commit -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)"
          git push origin "HEAD:${HEAD_REF}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # -- Step 5 — Update PR body with finalization note ---------------------
      - if: steps.changelog.outputs.stamp != ''
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.pr.outputs.number }}');
            const stamp = '${{ steps.changelog.outputs.stamp }}';
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            let body = pr.body || '';
            if (body.includes('<!-- auto-merge-finalization-note:')) return;
            const note = `\n\n## Auto-merge finalization\n\nThis run finalized the CHANGELOG at merge time: the placeholder was renamed to \`CHANGELOG/${stamp}.md\` (H1 rewritten to \`# ${stamp}\`). The current diff carries the finalized file.\n\n<!-- auto-merge-finalization-note: ${stamp} -->`;
            const idx = body.indexOf('## Attribution');
            body = idx >= 0 ? body.slice(0, idx) + note + '\n\n' + body.slice(idx) : body + note;
            await github.rest.pulls.update({ ...context.repo, pull_number: num, body });

      # -- Step 6 — Dispatch validator on the finalized head ------------------
      - if: steps.changelog.outputs.stamp != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pr-validator.yml',
              ref: '${{ steps.pr.outputs.head_ref }}',
            });

      # -- Step 7 — Wait briefly for the validator check-run to appear --------
      - if: steps.changelog.outputs.stamp != ''
        uses: actions/github-script@v7
        with:
          script: |
            const snooze = ms => new Promise(r => setTimeout(r, ms));
            for (let i = 0; i < 60; i++) {
              const { data: c } = await github.rest.checks.listForRef({
                ...context.repo,
                ref: '${{ steps.pr.outputs.head_ref }}',
              });
              if (c.check_runs.some(r => r.name === 'charly/pr-validator')) return;
              await snooze(5000);
            }
            core.warning('Validator check-run did not appear — auto-merge will still wait for it');

      # -- Step 8 — Enable native auto-merge, wait, tag -----------------------
      - if: steps.pr.outputs.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.pr.outputs.number }}');
            const stamp = '${{ steps.changelog.outputs.stamp }}';

            // Enable native auto-merge — GitHub handles ALL check waiting
            // via branch protection.  It only merges when EVERY required
            // status check is green on the PR head.
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, mergeMethod: SQUASH
                }) { pullRequest { id } }
              }
            `, { id: '${{ steps.pr.outputs.node_id }}' });
            core.info('Auto-merge enabled — GitHub will merge when all checks pass');

            // Poll for merge completion (lightweight PR state check)
            const snooze = ms => new Promise(r => setTimeout(r, ms));
            for (let i = 0; i < 180; i++) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
              if (pr.state === 'closed' && pr.merge_commit_sha) {
                const d = new Date(pr.merged_at);
                const y = d.getUTCFullYear();
                const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
                const hh = String(d.getUTCHours()).padStart(2, '0');
                const mm = String(d.getUTCMinutes()).padStart(2, '0');
                const ver = stamp || `${y}.${doy}.${hh}${mm}`;
                const tag = context.repo.repo === 'sdk'
                  ? `v0.${y}${doy}.${parseInt(hh + mm)}`
                  : `v${ver}`;
                try { await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` }); }
                catch { await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: pr.merge_commit_sha }); }
                return;
              }
              await snooze(5000);
            }
            core.setFailed('Timed out waiting for merge');
