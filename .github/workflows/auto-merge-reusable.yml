# ORG-WIDE AUTO-MERGE ENGINE (reusable via workflow_call)
#
# Triggered by EVERY completed check run on the PR branch.  Does a
# single check: "Are ALL check runs on the PR head green, including the
# pr-validator?"  If yes → finalize CHANGELOG and enable native auto-merge.
# If not → exit — the next check_run event will re-trigger.
#
# This is the correct event-driven pattern: every check completion
# naturally fires a re-check, regardless of which order checks finish.
name: auto-merge

on:
  workflow_call:
    inputs:
      head-sha:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Step 1 — Find the PR and check ALL checks on its current head
      # ------------------------------------------------------------------
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: '${{ inputs.head-sha }}',
            });
            const pr = prs.find(p => p.state === 'open');
            if (!pr) {
              core.setOutput('reason', 'no-open-pr');
              core.info('No open PR for this commit — skipping');
              return;
            }

            // Get ALL check runs on the PR's current head.
            const { data: checks } = await github.rest.checks.listForRef({
              ...context.repo, ref: pr.head.sha,
            });

            // 1. The pr-validator must exist AND be green.
            const validator = checks.check_runs.find(c => c.name === 'charly/pr-validator');
            if (!validator) {
              core.setOutput('reason', 'validator-not-run');
              core.info('Validator not yet run — skipping');
              return;
            }
            if (validator.status !== 'completed') {
              core.setOutput('reason', 'validator-pending');
              core.info('Validator still pending — skipping');
              return;
            }
            if (validator.conclusion !== 'success') {
              core.setOutput('reason', 'validator-failed');
              core.info(`Validator conclusion: ${validator.conclusion} — skipping`);
              return;
            }

            // 2. All OTHER check runs must be completed and green.
            const others = checks.check_runs.filter(c => c.name !== 'charly/pr-validator');
            const pending = others.filter(c => c.status !== 'completed');
            const failed = others.filter(c =>
              c.status === 'completed' &&
              !['success', 'skipped', 'neutral'].includes(c.conclusion)
            );

            if (pending.length > 0) {
              core.setOutput('reason', 'checks-pending');
              core.info(`${pending.length} check(s) still pending — will retry on next check_run`);
              pending.forEach(c => core.info(`  ${c.name}: ${c.status}`));
              return;
            }

            if (failed.length > 0) {
              core.setOutput('reason', 'checks-failed');
              core.info(`${failed.length} check(s) failed`);
              failed.forEach(c => core.info(`  ${c.name}: ${c.conclusion}`));
              return;
            }

            // ALL checks green — proceed.
            core.info(`All ${checks.check_runs.length} check(s) green — merging`);

            // If the PR has a merge_commit_sha, auto-merge was already enabled
            // (by a previous engine run) and the PR is about to merge.  Skip.
            if (pr.merge_commit_sha) {
              core.setOutput('reason', 'already-merging');
              core.info('PR already has a merge commit — auto-merge is in progress');
              return;
            }

            core.setOutput('reason', 'proceed');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      # ------------------------------------------------------------------
      # Step 2 — Nothing to do (not all green)
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.reason != 'proceed'
        run: echo 'Skip:' "${{ steps.pr.outputs.reason }}"

      # ------------------------------------------------------------------
      # Step 3 — Fetch PR branches for CHANGELOG diff
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.reason == 'proceed'
        run: |
          git fetch origin \
            "+refs/heads/${{ steps.pr.outputs.base_ref }}:refs/remotes/origin/${{ steps.pr.outputs.base_ref }}" \
            "+refs/heads/${{ steps.pr.outputs.head_ref }}:refs/remotes/origin/${{ steps.pr.outputs.head_ref }}"

      # ------------------------------------------------------------------
      # Step 4 — Finalize CHANGELOG (if placeholder exists)
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.reason == 'proceed'
        id: changelog
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          p=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" -- CHANGELOG/ \
            | awk '$1=="A"{print $NF}' \
            | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
          [ -z "$p" ] && echo "no-changelog" && exit 0

          c=$(git show "origin/$HEAD_REF:$p" 2>/dev/null || true)
          echo "$c" | grep -q "auto-merge-finalized: $(basename "$p" .md)" \
            && { echo "stamp=$(basename "$p" .md)" >> "$GITHUB_OUTPUT"; exit 0; }

          stamp=$(date -u +%Y.%j.%H%M)
          [ "$(basename "$p" .md)" = "$stamp" ] \
            && { echo "stamp=$stamp" >> "$GITHUB_OUTPUT"; exit 0; }

          git checkout -q -B dev/auto-merge "origin/$HEAD_REF"
          git mv "$p" "CHANGELOG/$stamp.md"
          sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md"
          git add "CHANGELOG/$stamp.md"
          git -c user.name='opencharly auto-merge' -c user.email='actions@github.com' \
            commit -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)"
          git push origin "HEAD:${HEAD_REF}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Step 5 — Update PR body (insert note before Attribution)
      # ------------------------------------------------------------------
      - if: steps.changelog.outputs.stamp != '' && steps.changelog.outputs.stamp != 'no-changelog'
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.pr.outputs.number }}');
            const stamp = '${{ steps.changelog.outputs.stamp }}';
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            let body = pr.body || '';
            if (body.includes('<!-- auto-merge-finalization-note:')) return;
            const note = `\n\n## Auto-merge finalization\n\nThis run finalized the CHANGELOG at merge time: the placeholder was renamed to \`CHANGELOG/${stamp}.md\` (H1 rewritten to \`# ${stamp}\`). The current diff carries the finalized file.\n\n<!-- auto-merge-finalization-note: ${stamp} -->`;
            const idx = body.indexOf('## Attribution');
            body = idx >= 0 ? body.slice(0, idx) + note + '\n\n' + body.slice(idx) : body + note;
            await github.rest.pulls.update({ ...context.repo, pull_number: num, body });

      # ------------------------------------------------------------------
      # Step 6 — Dispatch validator re-run on new head (only fresh finalization)
      # ------------------------------------------------------------------
      - if: steps.changelog.outputs.fresh == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pr-validator.yml',
              ref: '${{ steps.pr.outputs.head_ref }}',
            });

      # ------------------------------------------------------------------
      # Step 7 — Enable native auto-merge
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.reason == 'proceed'
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, mergeMethod: SQUASH
                }) { pullRequest { id } }
              }
            `, { id: '${{ steps.pr.outputs.node_id }}' });
            core.info('Auto-merge enabled');
