# ORG-WIDE AUTO-MERGE ENGINE (reusable via workflow_call)
#
# Fires every time pr-validator completes.  Does a SINGLE check of ALL
# check runs on the PR head.  If all green → finalize CHANGELOG, enable
# native auto-merge, and exit.  If not all green → exit gracefully.
#
# The next trigger (push, manual re-run, or re-validator pass) will
# re-check.  No polling, no sleep, no loops.
#
# Companion: tag-on-merge.yml — tags the merge commit when PR merges.
name: auto-merge

on:
  workflow_call:
    inputs:
      head-sha:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Step 1 — Find PR and verify ALL check runs are green
      # ------------------------------------------------------------------
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: '${{ inputs.head-sha }}',
            });
            const pr = prs.find(p => p.state === 'open');
            if (!pr) {
              core.setOutput('verdict', 'skip');
              core.info('PR already closed — nothing to do');
              return;
            }

            // Single non-looping check of ALL check runs on the PR head.
            const { data: checks } = await github.rest.checks.listForRef({
              ...context.repo, ref: pr.head.sha,
            });

            const pending = checks.check_runs.filter(c => c.status !== 'completed');
            const failed = checks.check_runs.filter(c =>
              c.status === 'completed' &&
              !['success', 'skipped', 'neutral'].includes(c.conclusion)
            );

            if (pending.length > 0) {
              core.setOutput('verdict', 'skip');
              core.info(`${pending.length} check(s) still pending — will retry on next trigger`);
              pending.forEach(c => core.info(`  pending: ${c.name} (${c.status})`));
              return;
            }

            if (failed.length > 0) {
              core.setOutput('verdict', 'skip');
              core.info(`${failed.length} check(s) failed — will retry on next trigger`);
              failed.forEach(c => core.info(`  failed: ${c.name} (${c.conclusion})`));
              return;
            }

            // ALL checks green — proceed with merge.
            core.info(`All ${checks.check_runs.length} check(s) green`);
            core.setOutput('verdict', 'proceed');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      # ------------------------------------------------------------------
      # Step 2 — Nothing to do (PR closed or checks not ready)
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.verdict == 'skip'
        run: echo "Skip — $(echo ${{ steps.pr.outputs.verdict }})"

      # ------------------------------------------------------------------
      # Step 3 — Fetch PR branches for CHANGELOG diff
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.verdict == 'proceed'
        run: |
          git fetch origin \
            "+refs/heads/${{ steps.pr.outputs.base_ref }}:refs/remotes/origin/${{ steps.pr.outputs.base_ref }}" \
            "+refs/heads/${{ steps.pr.outputs.head_ref }}:refs/remotes/origin/${{ steps.pr.outputs.head_ref }}"

      # ------------------------------------------------------------------
      # Step 4 — Finalize CHANGELOG (if placeholder exists)
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.verdict == 'proceed'
        id: changelog
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          p=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" -- CHANGELOG/ \
            | awk '$1=="A"{print $NF}' \
            | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
          [ -z "$p" ] && echo "no-changelog" && exit 0

          c=$(git show "origin/$HEAD_REF:$p" 2>/dev/null || true)
          echo "$c" | grep -q "auto-merge-finalized: $(basename "$p" .md)" \
            && { echo "stamp=$(basename "$p" .md)" >> "$GITHUB_OUTPUT"; exit 0; }

          stamp=$(date -u +%Y.%j.%H%M)
          [ "$(basename "$p" .md)" = "$stamp" ] \
            && { echo "stamp=$stamp" >> "$GITHUB_OUTPUT"; exit 0; }

          git checkout -q -B dev/auto-merge "origin/$HEAD_REF"
          git mv "$p" "CHANGELOG/$stamp.md"
          sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md"
          git add "CHANGELOG/$stamp.md"
          git -c user.name='opencharly auto-merge' -c user.email='actions@github.com' \
            commit -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)"
          git push origin "HEAD:${HEAD_REF}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Step 5 — Update PR body (insert note before Attribution)
      # ------------------------------------------------------------------
      - if: steps.changelog.outputs.stamp != '' && steps.changelog.outputs.stamp != 'no-changelog'
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.pr.outputs.number }}');
            const stamp = '${{ steps.changelog.outputs.stamp }}';
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            let body = pr.body || '';
            if (body.includes('<!-- auto-merge-finalization-note:')) return;
            const note = `\n\n## Auto-merge finalization\n\nThis run finalized the CHANGELOG at merge time: the placeholder was renamed to \`CHANGELOG/${stamp}.md\` (H1 rewritten to \`# ${stamp}\`). The current diff carries the finalized file.\n\n<!-- auto-merge-finalization-note: ${stamp} -->`;
            const idx = body.indexOf('## Attribution');
            body = idx >= 0 ? body.slice(0, idx) + note + '\n\n' + body.slice(idx) : body + note;
            await github.rest.pulls.update({ ...context.repo, pull_number: num, body });

      # ------------------------------------------------------------------
      # Step 6 — Dispatch validator re-run on new head (if finalized)
      # ------------------------------------------------------------------
      - if: steps.changelog.outputs.stamp != '' && steps.changelog.outputs.stamp != 'no-changelog'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pr-validator.yml',
              ref: '${{ steps.pr.outputs.head_ref }}',
            });

      # ------------------------------------------------------------------
      # Step 7 — Enable native auto-merge
      # ------------------------------------------------------------------
      - if: steps.pr.outputs.verdict == 'proceed'
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, mergeMethod: SQUASH
                }) { pullRequest { id } }
              }
            `, { id: '${{ steps.pr.outputs.node_id }}' });
            core.info('Auto-merge enabled — PR will merge when all checks pass');
