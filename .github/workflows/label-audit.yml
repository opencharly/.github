name: label-audit

# Audit every open issue for exactly one category: and one type:. REPORT-ONLY by
# default: it applies a form answer only when the org variable LABELS_AUDIT_APPLY
# is true, and it reds the run only when LABELS_AUDIT_STRICT is true. There is no
# fallback label — a missing or split axis is reported, never guessed.
#
# TWO SCOPES, ONE PARSER:
#   * an `issues` event (opened/edited/reopened) audits THAT issue only, applying
#     its form answer at creation time (the rulebook's "set at creation through
#     the org issue form") — a single-repo read, never the whole org;
#   * the schedule / a dispatch runs the full-org audit, the daily backstop.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Create bot token (charly-auto-merge App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, node24
        with:
          app-id: ${{ secrets.CHARLY_AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.CHARLY_AUTO_MERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24

      - name: Audit the org issue-label taxonomy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLY: ${{ vars.LABELS_AUDIT_APPLY }}
          STRICT: ${{ vars.LABELS_AUDIT_STRICT }}
          CLOSE_PASS: ${{ vars.LABELS_AUDIT_CLOSE_PASS }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "issues" ]; then
            # One issue, the same parser, the same APPLY policy. This scope is never
            # strict — a form-less issue is the daily audit's finding, not a reason to
            # red an unrelated event. NOTE: the org ruleset activates its required
            # workflow on pull_request events only, so this trigger fires in THIS
            # repository; org-wide the daily audit below is the applier.
            single=(audit --issue "${ISSUE_REPO}#${ISSUE_NUM}")
            if [ "${APPLY:-false}" = "true" ]; then single+=(--apply); fi
            bash scripts/labels.sh "${single[@]}"
            exit 0
          fi
          args=(audit --org --state open)
          if [ "${APPLY:-false}" = "true" ]; then args+=(--apply); fi
          if [ "${STRICT:-false}" = "true" ]; then args+=(--strict); fi
          if [ "${CLOSE_PASS:-true}" = "true" ]; then args+=(--close-pass); fi
          bash scripts/labels.sh "${args[@]}"
