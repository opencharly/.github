# ORG-WIDE CLAWSWEEPER ADVISORY REVIEW (reusable, called via workflow_call)
#
# A SECOND REVIEWER, ADVISORY ONLY. The required gate stays `validate / validate`
# (pr-validator.yml): this check is never a branch-protection requirement, it can never
# block a merge, and a red run here is a review that did not happen, not a policy verdict.
#
# THE CALLER MUST GRANT THESE SCOPES. A called workflow's GITHUB_TOKEN can hold only what
# its caller grants, and the default is read-only — without them BOTH the image pull and the
# comment post fail:
#
#     permissions:
#       contents: read
#       pull-requests: write
#       packages: read
#
# WHAT IT RUNS. One container of the pinned review image against a THROWAWAY fetch of the PR
# at /target, invoked as `clawsweeper-review` (the image is a one-shot tool with no ENTRYPOINT,
# so the command is named here). That entrypoint passes `--local-range`, so the engine reads
# merge-base(base, HEAD)..HEAD and performs no GitHub reads or writes.
#
# WHY /target IS WRITABLE, AND WHY THAT IS STILL ISOLATED. The engine keeps its review state
# under `<target>/.git/clawsweeper/` — measured: a read-only mount dies on
# `mkdir '/target/.git/clawsweeper/reviews'`. The tree is NOT the runner's checkout: it is a
# private fetch made in this job only (`refs/pull/<n>/head` into `${RUNNER_TEMP}`) and deleted
# with the runner's temp dir, so a write there reaches nothing that can be pushed. The isolation
# that matters is unchanged: no GitHub token enters the container, no Docker socket is mounted,
# and the JSON verdict leaves on stdout for THIS workflow to post.
#
# NETWORK. `--network bridge` gives the container EGRESS, which it needs: the model endpoint
# is remote. What it does NOT have is a credential, a socket, or any writable path that can be
# pushed: the writable tree it sees is the job's own throwaway fetch (see above), and the
# runner's checkout is never mounted here at all.
#
# THE MODEL ENDPOINT is the org's existing Ollama Cloud one. The key is the org secret
# `AI_REVIEW_API_KEY` — the SAME secret the required gate already uses — mapped onto
# `OLLAMA_API_KEY`, the env var the image's CODEX_HOME names. One key, no new secret (R2).
#
# SECRETS NEVER REACH A PUBLIC SURFACE. The container's output is REDACTED (every non-empty
# secret value replaced with `***`) before it is echoed to the job log or embedded in the PR
# comment: a model client that prints its environment on a failed request must not publish
# the org key.
#
# THE PULL IS AUTHENTICATED IN A THROWAWAY DOCKER CONFIG. The image is an org-INTERNAL GHCR
# package (anonymous pulls are refused), so the run's own read-only token logs in — into
# `${RUNNER_TEMP}`, never `~/.docker`, and that directory is removed in an `always()` step so
# nothing survives on a persistent self-hosted runner.
#
# IMAGE PIN. `vars.CLAWSWEEPER_IMAGE` is the single bump point, exactly as
# `vars.CHARLY_VERSION` already is for the required gate; the `image` input is for a one-off
# run against a candidate build. An unset variable is a LOUD failure, never a silent
# fallback to a rolling tag.
#
# VISIBLE SKIP, NEVER A MOCK (R8). With no `AI_REVIEW_API_KEY` in scope the workflow posts a
# comment saying the review was NOT exercised and exits 0. It never fabricates a verdict.
#
# PUBLIC AND PRIVATE REPOS. The checkout fetch authenticates with the run's token supplied as
# a one-shot git `http.extraheader` (never written to a config file), so `refs/pull/<n>/head`
# resolves on a private repo too.
#
# NO CONCURRENCY BLOCK: unlike the required gate this check costs no API budget worth
# cancelling, and a caller may lack `actions: write`; re-runs are cheap here.

name: clawsweeper

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      # IMAGE PIN OVERRIDE. Empty = org variable CLAWSWEEPER_IMAGE.
      image:
        required: false
        type: string
    secrets:
      AI_REVIEW_API_KEY:
        required: false

permissions:
  contents: read
  # ONE comment per pull request, plus the advisory labels — both are writes.
  pull-requests: write
  issues: write
  # The review image is an org-internal GHCR package; the pull needs a token. Read-only.
  packages: read

jobs:
  review:
    name: clawsweeper
    # The Docker-capable fleet. `vars.CI_DOCKER_RUNNER_LABEL` is the org variable the repo
    # CI already uses for container jobs.
    runs-on: [self-hosted, "${{ vars.CI_DOCKER_RUNNER_LABEL || 'opencharly-ubuntu' }}"]
    # A review is a bounded model round-trip. The cap converts a provider stall into a
    # concluded red run instead of a job that occupies a runner for hours.
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr-number }}
      # The governing program is read from a PINNED umbrella commit, not `main`: the review
      # must judge against a fixed text, exactly as it judges a fixed PR head.
      UMBRELLA_REF: d4f6b0d4a32366ef8428986057186fc3984cebf9
    steps:
      - name: Check the image pin is configured
        id: pin
        env:
          IMAGE: ${{ inputs.image || vars.CLAWSWEEPER_IMAGE }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE}" ]; then
            echo "::error::Neither the 'image' input nor vars.CLAWSWEEPER_IMAGE is set."
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Fetch the PR head and its base, and resolve the merge base
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "::error::pr-number must be numeric, got '${PR_NUMBER}'"; exit 1 ;;
          esac
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"

          # Fetch both sides from the BASE repository: `refs/pull/<n>/head` exists there for
          # every PR, fork or not. The token rides a ONE-SHOT http.extraheader — never written
          # to a git config — so this works on a private repo too.
          review="${RUNNER_TEMP}/review"
          rm -rf "$review" && mkdir -p "$review"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git init -q "$review"
          git -C "$review" -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" \
            "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          git -C "$review" checkout -q -B pr refs/remotes/pr/head

          base_sha="$(git -C "$review" merge-base HEAD "refs/remotes/origin/${base_ref}")"

          # THE GOVERNING PROGRAM. The umbrella repo's SOUL.md and VISION.md are handed to the
          # reviewer read-only at /umbrella: they are the statement of who the project is and
          # where it is going, and a review that ignores them is incomplete. Fetched here with
          # the run's own token, from a pinned ref, so the review reads a fixed text.
          umbrella="${RUNNER_TEMP}/umbrella"
          rm -rf "$umbrella" && mkdir -p "$umbrella"
          for f in SOUL.md VISION.md; do
            if ! gh api "repos/opencharly/opencharly/contents/${f}?ref=${UMBRELLA_REF}" \
                 -H "Accept: application/vnd.github.raw" > "${umbrella}/${f}"; then
              # The governing program is not optional: a review that cannot read it is not the
              # review this workflow promises, so this is a VISIBLE failure of the check, not a
              # silent downgrade to a repo-only review.
              echo "::error::Could not fetch opencharly/opencharly@${UMBRELLA_REF}/${f}; refusing a review without the governing program."
              exit 1
            fi
            if ! test -s "${umbrella}/${f}"; then
              echo "::error::opencharly/opencharly@${UMBRELLA_REF}/${f} came back empty."
              exit 1
            fi
          done

          echo "review=${review}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "umbrella=${umbrella}" >> "$GITHUB_OUTPUT"

          # THE PR BODY, handed to the engine with --body-file. The engine reviews THIS exact
          # body and assesses its proof claims against it ("AUTHORITATIVE PR BODY … Do NOT
          # fetch, prefer, or assume any other version"). Without it the review could not see
          # what the PR claims it did — which is most of what a reviewer must judge.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' \
            > "${RUNNER_TEMP}/pr-body.md"
          echo "body_chars=$(wc -c < "${RUNNER_TEMP}/pr-body.md")"
          echo "body=${RUNNER_TEMP}/pr-body.md" >> "$GITHUB_OUTPUT"

      - name: Run one review in a throwaway container
        id: review
        env:
          IMAGE: ${{ steps.pin.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OLLAMA_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          REVIEW_DIR: ${{ steps.pr.outputs.review }}
          UMBRELLA_DIR: ${{ steps.pr.outputs.umbrella }}
          PR_BODY_FILE: ${{ steps.pr.outputs.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          GOVERNING_PROMPT: |
            ## Governing program (the opencharly umbrella)
            The umbrella repository opencharly/opencharly is mounted READ-ONLY at /umbrella.
            Before judging anything, read /umbrella/SOUL.md and /umbrella/VISION.md IN FULL.
            They are the governing statement of who this project is and where it is going, and
            they outrank local convenience.
            Your report must say explicitly whether the change fits that vision and character.
            Flag anything that works against them, and name it in the review findings rather
            than leaving it implicit.
        run: |
          set -euo pipefail
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "SKIP: AI_REVIEW_API_KEY is not in scope — the review was NOT exercised."
            exit 0
          fi

          # The pull is authenticated into a THROWAWAY docker config, removed by the
          # always() cleanup step: a persistent self-hosted runner must not keep the token.
          DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          export DOCKER_CONFIG
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          # Codex's own sandbox is bubblewrap, and bwrap needs an unprivileged user
          # namespace. Docker's DEFAULT seccomp profile masks that clone, so the sandbox
          # died with "bwrap: No permissions to create new namespace" and every review
          # failed before the model — measured on crabbox@16. Relaxing seccomp here does not
          # widen what the container can REACH (still no token, no socket, a throwaway tree);
          # it lets the sandbox that guards code execution start at all.
          set +e
          docker run --rm \
            --network bridge \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e OLLAMA_API_KEY \
            -e CLAWSWEEPER_TARGET_REPO="${GITHUB_REPOSITORY}" \
            -e BASE_SHA="${BASE_SHA}" \
            -e TARGET_DIR=/target \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/target \
            -v "${REVIEW_DIR}:/target" \
            -v "${UMBRELLA_DIR}:/umbrella:ro" \
            -v "${PR_BODY_FILE}:/body.md:ro" \
            -e CLAWSWEEPER_ADDITIONAL_PROMPT="${GOVERNING_PROMPT}" \
            "${IMAGE}" clawsweeper-review \
            --body-file /body.md \
            > "${RUNNER_TEMP}/verdict.json" 2> "${RUNNER_TEMP}/review.log"
          rc=$?
          set -e

          # REDACT BEFORE ANY surface sees it: a model client that echoes its environment on a
          # failed request must never publish the org key into a PUBLIC PR comment.
          for f in "${RUNNER_TEMP}/verdict.json" "${RUNNER_TEMP}/review.log"; do
            [ -f "$f" ] || continue
            for s in "${OLLAMA_API_KEY:-}" "${GITHUB_TOKEN:-}"; do
              [ -n "$s" ] || continue
              esc="$(printf '%s' "$s" | sed -e 's/[\/&]/\\&/g')"
              sed -i "s/${esc}/***/g" "$f"
            done
          done
          tail -c 4000 "${RUNNER_TEMP}/review.log"

          # THE FULL REVIEW, extracted here so the comment can post it. The engine writes a
          # complete markdown report inside reports[0].report; its leading YAML frontmatter is
          # metadata for the engine, not for a reader, so it is stripped.
          if jq -e . "${RUNNER_TEMP}/verdict.json" >/dev/null 2>&1; then
            jq -r '.reports[0].report // empty' "${RUNNER_TEMP}/verdict.json" \
              | awk 'NR==1 && $0=="---"{fm=1;next} fm && $0=="---"{fm=0;next} !fm' \
              > "${RUNNER_TEMP}/report.md"
          fi
          if [ -f "${RUNNER_TEMP}/report.md" ]; then
            echo "report_chars=$(wc -c < "${RUNNER_TEMP}/report.md")"
          else
            echo "report_chars=0"
          fi
          echo "review_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          # A review that produced nothing, or ran and reported failure, is a RED check — an
          # advisory check that always passes is indistinguishable from one that stopped
          # working. The comment step still runs (it is gated on the review step having
          # EXECUTED), so the red carries the redacted reason.
          if [ "$rc" -ne 0 ]; then
            echo "::error::clawsweeper-review exited ${rc}; the redacted output is posted as the comment."
            exit 1
          fi
          if [ -s "${RUNNER_TEMP}/verdict.json" ] && jq -e . "${RUNNER_TEMP}/verdict.json" >/dev/null 2>&1; then
            verdict_status="$(jq -r '.status // "unknown"' "${RUNNER_TEMP}/verdict.json")"
            if [ "${verdict_status}" = "failed" ]; then
              echo "::error::the review ran but reported status=failed; the redacted output is posted as the comment."
              exit 1
            fi
          else
            echo "::error::the review produced no JSON verdict; the redacted output is posted as the comment."
            exit 1
          fi

      - name: Post the review comment, updating the previous one
        id: comment
        # ONLY when the review step actually ran. A pin or fetch failure is an INFRA error and
        # must not be dressed up as "the engine produced no verdict".
        if: always() && steps.review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIPPED: ${{ steps.review.outputs.skipped }}
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
        run: |
          set -euo pipefail
          marker='<!-- clawsweeper-review -->'
          body_file="${RUNNER_TEMP}/comment.md"
          verdict="${RUNNER_TEMP}/verdict.json"

          # THE REVIEW'S OWN DECISION lives in the report's YAML frontmatter. The JSON has no
          # top-level `decision`, so `.decision // .status` was showing the RUN STATUS
          # ("completed"), not the verdict. Parsed here, from the engine's own field.
          decision=""; confidence=""; review_status=""; findings=0
          if [ -s "$verdict" ] && jq -e . "$verdict" >/dev/null 2>&1; then
            raw_report="$(jq -r '.reports[0].report // empty' "$verdict")"
            if [ -n "$raw_report" ]; then
              # Only a report that ACTUALLY begins with `---` has frontmatter; anything else
              # yields an empty block rather than "everything after line 1".
              fm="$(printf '%s\n' "$raw_report" | awk 'NR==1 && $0!="---"{exit} NR==1{next} /^---$/{exit} {print}')"
              decision="$(printf '%s\n' "$fm" | awk -F': ' '/^decision: /{print $2; exit}')"
              confidence="$(printf '%s\n' "$fm" | awk -F': ' '/^confidence: /{print $2; exit}')"
              review_status="$(printf '%s\n' "$fm" | awk -F': ' '/^review_status: /{print $2; exit}')"
              findings="$(printf '%s\n' "$raw_report" | awk '/^## Review Findings/{f=1;next} f&&/^## /{exit} f&&/^- /{c++} END{print c+0}')"
            fi
          fi
          echo "decision=${decision:-none} confidence=${confidence:-none} review_status=${review_status:-none} findings=${findings}"
          # The label decision. "reviewed" means a review COMPLETED with a valid report and
          # raised nothing; everything else that ran is needs-attention — a review that errored
          # has NOT reviewed the code, so labelling it reviewed would be a false claim.
          if [ "${SKIPPED:-}" = "true" ]; then
            label_decision="skip"
          elif [ "$review_status" = "complete" ] && [ "${findings:-0}" -eq 0 ]; then
            label_decision="reviewed"
          else
            label_decision="needs-attention"
          fi
          echo "decision=${label_decision}" >> "$GITHUB_OUTPUT"

          {
            echo "$marker"
            echo "## ClawSweeper review (advisory)"
            echo
            if [ "${SKIPPED:-}" = "true" ]; then
              echo "**Not exercised.** \`AI_REVIEW_API_KEY\` is not in scope for this run, so no"
              echo "review was performed. This is a visible skip, not a pass."
            elif [ -s "$verdict" ] && jq -e . "$verdict" >/dev/null 2>&1; then
              # A VALID verdict always shows its decision, even when the markdown report came
              # back empty — hiding a real decision behind a generic message would be worse
              # than showing it with a note.
              if [ -n "$decision" ]; then
                echo "**Decision:** \`${decision}\`${confidence:+ (confidence: ${confidence})}"
              else
                echo "**Decision:** \`$(jq -r '.status // "unknown"' "$verdict")\`"
              fi
              echo
              if [ -s "${RUNNER_TEMP}/report.md" ]; then
                # THE FULL REVIEW. The engine writes a complete markdown report; posting the
                # raw JSON instead threw almost all of it away.
                cat "${RUNNER_TEMP}/report.md"
              else
                echo "_The engine returned a decision but no markdown report. The JSON is below._"
              fi
              echo
              echo "<details><summary>Raw JSON verdict</summary>"
              echo
              echo '```json'
              jq . "$verdict"
              echo '```'
              echo
              echo "</details>"
            else
              echo "**The engine produced no report** (exit \`${REVIEW_RC:-?}\`). The redacted output:"
              echo
              echo '```'
              tail -c 20000 "${RUNNER_TEMP}/review.log" 2>/dev/null || echo "(no output captured)"
              echo '```'
            fi
            echo
            echo "This check is advisory: it never blocks a merge. The required gate is"
            echo "\`validate / validate\`."
          } > "$body_file"

          # PAGINATE: a busy PR can push the marker past the first page, and a missed marker
          # means a new comment on every run.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))] | last | .id // empty")"
          # --input with a jq-built payload, never -f body=@file: the field form's @file
          # handling is engine-specific, the JSON payload is not.
          jq -Rs '{body: .}' "$body_file" > "${RUNNER_TEMP}/payload.json"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input "${RUNNER_TEMP}/payload.json" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "${RUNNER_TEMP}/payload.json" >/dev/null
          fi

      - name: Apply the advisory labels
        # ADVISORY LABELS ONLY — this never closes, approves or merges anything.
        #   clawsweeper:reviewed        this head was reviewed
        #   clawsweeper:needs-attention the review raised findings, or could not complete
        if: always() && steps.review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECISION: ${{ steps.comment.outputs.decision }}
        run: |
          set -euo pipefail
          ensure_label() {
            gh api "repos/${GITHUB_REPOSITORY}/labels/$1" >/dev/null 2>&1 && return 0
            gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f name="$1" -f color="$2" -f description="$3" >/dev/null
          }
          case "${DECISION:-}" in
            skip)
              echo "no review was performed; labels untouched"
              exit 0
              ;;
            reviewed)
              ensure_label "clawsweeper:reviewed" "0e8a16" "ClawSweeper reviewed this pull request"
              ensure_label "clawsweeper:needs-attention" "d93f0b" "ClawSweeper raised a finding a human should look at"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
                -f "labels[]=clawsweeper:reviewed" >/dev/null
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/clawsweeper:needs-attention" >/dev/null 2>&1 || true
              ;;
            *)
              ensure_label "clawsweeper:needs-attention" "d93f0b" "ClawSweeper raised a finding a human should look at"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
                -f "labels[]=clawsweeper:needs-attention" >/dev/null
              # "reviewed" is a claim about THIS head; a later failing run must not leave it.
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/clawsweeper:reviewed" >/dev/null 2>&1 || true
              ;;
          esac

      - name: Drop the throwaway docker credentials
        if: always()
        run: rm -rf "${RUNNER_TEMP}/docker-config"
