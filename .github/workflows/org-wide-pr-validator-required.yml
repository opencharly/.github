# ORG-WIDE PR VALIDATOR — the REQUIRED WORKFLOW (org ruleset `workflows` rule).
#
# This is the single org-level entry point. It is NOT copied into any repo: the ONE
# organization ruleset (owned by scripts/org-ruleset.sh) points at THIS file in
# `opencharly/.github`, and GitHub runs it on every pull request in every targeted
# repo. One file, one owner, zero per-repo copies to drift.
#
# WHY THIS EXISTS. GitHub's only native way to require a workflow org-wide is the
# `workflows` ruleset rule, available on the Team plan (the org was on the free plan
# when the per-repo dispatcher pattern began). This replaces the per-repo
# `.github/workflows/pr-validator.yml` dispatcher stub entirely: the org ruleset
# carries BOTH the `workflows` rule AND the ordinary branch rules (required status
# check `validate / validate`, no force-push, no deletion, no creation), so the same
# one ruleset also replaces the per-repo branch rulesets.
#
# The required workflow runs in the TARGET repo's context but its definition is read
# from this repo at the pinned ref; it calls the same reusable validator
# (`pr-validator.yml@main`) the whole org uses, so the gate logic stays one source.
# The check it produces is `<job name> / validate` — the exact context required.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# WHY `labeled` IS THE RERUN CHANNEL (and `edited` is NOT).
#
# The validator validates the PR — the diff at the branch head AND the body — every time it
# runs, and it fetches the PR LIVE by number. So a body-only fix after a BLOCK needs no new
# commit: it needs the SAME run re-executed, which re-reads the corrected body. GitHub's re-run
# reuses the SAME GITHUB_SHA and updates THAT run's check run IN PLACE — no duplicate same-name
# check run — so it clears the POISON state (a completed same-name FAILURE that keeps a green
# re-run BLOCKED; see the POISON section in the git-workflow skill).
#
# The trigger for that is a `rerun` LABEL. MEASURED: `pull_request: edited` (a body-only change)
# did NOT fire this required workflow (a plain per-repo `edited` workflow in the same repo DID,
# so the event is delivered — the required-workflow trigger path simply does not act on it). A
# `rerun`-label add is the explicit, capability-free channel: the `rerun-validator` job below
# turns it into `gh run rerun` on THIS head's failed validator run — only `actions: write`
# (already granted), same SHA, same check run, no duplicate, no POISON.
#
# LOOP-SAFE: the rerun job only POSTs a re-run request — it edits no body/title and adds no
# label, so it cannot re-fire itself.

# ONE run per PR: a re-dispatch/push cancels the in-flight run, so the head can never
# carry duplicate same-name `validate / validate` check runs (a duplicate FAILED run
# kept `mergeable_state: blocked` despite PASS — measured on opencharly #38,
# CHANGELOG/2026.251.0758.md). The concurrency block lives HERE, on the workflow that
# declares it, and this workflow therefore carries `actions: write`: `actions: write`
# is the permission that permits cancelling a workflow run (GitHub Actions
# permissions table), and the measured regression #163 (CHANGELOG/2026.251.0844.md:
# "callers whose installed dispatchers lack `actions: write` ... fail to expand the
# reusable (0 jobs, instant failure)") is why the reusable pr-validator.yml
# deliberately carries NO concurrency of its own. Keeping this top-level workflow's
# declaration together with `actions: write` is the configuration measured to expand
# and dedupe.
concurrency:
  group: pr-validator-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  validate:
    name: validate
    # Skip the full AI review on a label-only event: a `rerun` label re-runs the EXISTING run
    # via `rerun-validator`, it does not review the same head again.
    if: github.event.pull_request.head.repo.fork == false && github.event.action != 'labeled'
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      # Exact parity with the retired per-repo dispatcher: forward the provider
      # selection. `vars` resolves in the TARGET repo's context (org-level variables
      # with visibility `all` are in scope), so a repo can still override per-repo.
      # The reusable itself falls back to `vars.AI_REVIEW_*` when these are empty.
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit

  # The `rerun`-label listener: the sanctioned, capability-free way to clear a body-only BLOCK
  # after fixing the PR body (no empty commit). It re-runs THIS head's failed
  # `charly/pr-validator` run, which re-reads the corrected body and updates the SAME
  # `validate / validate` check run in place (same SHA -> no duplicate, no POISON).
  rerun-validator:
    name: rerun-validator
    if: github.event.pull_request.head.repo.fork == false && github.event.action == 'labeled' && github.event.label.name == 'rerun'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed validator run on this PR head (same SHA, same check-run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The PR head SHA — NOT the workflow's merge-branch GITHUB_SHA.
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "rerun label on $REPO#$PR head=$HEAD"
          # The newest FAILED validator run whose head is exactly this PR head. A re-run of
          # THAT run reuses its GITHUB_SHA and updates its own `validate / validate` check run
          # in place — no second same-name check run (which would re-poisons the rollup).
          id="$(gh run list --repo "$REPO" --limit 100 \
            --json databaseId,headSha,name,conclusion \
            --jq '.[] | select(.headSha=="'"'"'"$HEAD"'"'"'") | select(.name=="charly/pr-validator") | select(.conclusion=="failure") | .databaseId' \
            | head -1)"
          if [ -z "$id" ]; then
            echo "no failed charly/pr-validator run for $HEAD — nothing to re-run"
            exit 0
          fi
          echo "re-running validator run $id (head $HEAD)"
          gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null
          echo "re-run triggered: the same check run re-executes against the corrected body"
