# ORG-WIDE PR VALIDATOR (reusable, called via workflow_call)
#
# Validates a PR via AI review. On PASS, enables GitHub native auto-merge
# (squash). GitHub branch protection waits for all required checks
# (including repo-specific CI gates like verify/go) before merging.
#
# No CHANGELOG rename — the merge workflow creates CHANGELOG from PR body.
# No bot tokens needed.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: opencharly/pi-review-action@v1.0.11
        id: review
        with:
          provider: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          model: ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          base_url: ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20
          pr_number: ${{ inputs.pr-number }}

      - name: Parse verdict
        id: parse
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          [ "$n" -eq 0 ] && { echo "::error::No verdict in response"; exit 2; }
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate (BLOCK)
        if: steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1

      - name: Gate (ambiguous)
        if: steps.parse.outputs.verdict != 'PASS' && steps.parse.outputs.verdict != 'BLOCK'
        run: |
          echo "::error::Ambiguous verdict from AI review"
          exit 2

      # Enable auto-merge — RESILIENTLY. GitHub rejects the mutation with
      # "Pull request is in unstable status" while any required check is still
      # pending/failing, and repos may legitimately carry more than one check
      # besides this one (e.g. a candy CI gate). The REVIEW verdict is already
      # PASS at this point, so arming logistics must never turn the required
      # check red: retry through transient settling states, attempt the
      # update-branch merge when the branch is behind, and soft-skip (warning)
      # when the repository setting does not allow auto-merge.
      - name: Enable auto-merge
        if: steps.parse.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # The job shell runs with -e: a bare failing $( ) assignment would
            # kill the script before the retry loop runs. Capture in a
            # condition context (errexit-immune) instead.
            rc=0
            out=$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" 2>&1) || rc=$?
            echo "attempt $attempt rc=$rc: $out"
            if [ $rc -eq 0 ]; then
              echo "Auto-merge armed"
              exit 0
            fi
            case "$out" in
              *"unstable status"*)
                echo "attempt $attempt: required checks still settling — retrying"
                sleep 20
                continue
                ;;
              *"not allowed for this repository")
                echo "::warning::repo setting allow_auto_merge is off — auto-merge not armed (verdict PASS stands)"
                exit 0
                ;;
              *"behind"*|*"BEHIND"*|*"not mergeable"*)
                echo "attempt $attempt: branch is behind base — updating and retrying"
                gh pr update-branch "$PR_NUMBER" --repo "$REPO" >/dev/null 2>&1 || true
                sleep 15
                continue
                ;;
              *)
                echo "::warning::unrecognized arming failure (attempt $attempt, rc=$rc) — retrying; verdict PASS stands regardless"
                sleep 15
                ;;
            esac
          done
          echo "::warning::auto-merge could not be armed after retries (verdict PASS stands; a later dispatcher run can arm it)"
          exit 0
