# ORG-WIDE PR VALIDATOR (reusable, called via workflow_call)
#
# Validates a PR via AI review. On PASS, enables GitHub native auto-merge
# (squash). GitHub branch protection waits for all required checks
# (including repo-specific CI gates like verify/go) before merging.
#
# Runs the plugin-review charly plugin (the action-review cutover, replacing
# opencharly/pi-review-action): read-only GitHub tools, deterministic
# Verdict: PASS|BLOCK, ONE PR comment, $GITHUB_OUTPUT outputs. WHICH plugins/
# steps run is declared in opencharly/action-review@main:prompt/validator.md +
# review-plan.yml (charly review --plan); this workflow never changes for that.
#
# No CHANGELOG rename — the merge workflow creates CHANGELOG from PR body.
# No bot tokens needed.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

# NO concurrency here: cancel-in-progress requires the caller to hold actions:
# write, and legacy callers (old dispatchers) lack it — see #163 infra regression.
# The dedupe lives in the per-repo DISPATCHERS, which declare actions: write.
permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: validate
    runs-on: ${{ vars.REVIEW_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      - uses: actions/checkout@v7
        with:
          repository: opencharly/action-review
          ref: main
          path: runner-config
          fetch-depth: 1

      - name: "Ensure charly (action-review config repo; self-hosted image: no-op)"
        id: ensure-charly
        env:
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION || '' }}
        run: |
          if command -v charly >/dev/null 2>&1; then
            echo "charly present: $(charly version)"; exit 0
          fi
          # PINNED charly release - the gate is deterministic; bump here per release
          # (vars.CHARLY_VERSION overrides). No runtime latest-resolution: the
          # releases/latest redirect is abuse-limited on shared runner IPs (curl exit 22).
          TAG="${CHARLY_VERSION:-v2026.251.1947}"
          # PER-RUN dir (runner.temp, wiped between jobs): on self-hosted runners
          # $HOME persists across jobs and a stale plugin binary there crashes
          # the gate (live evidence: plugin-review parseReviewArgs panic, exit 2,
          # while the same tag+tar runs green in a clean dir).
          D="${{ runner.temp }}/charly-$TAG"; mkdir -p "$D/bin" "$D/plugins"
          # release assets are public — tokenless curl (gh/GITHUB_TOKEN injection
          # is unreliable in workflow_call step envs: live smoke exit-4 evidence).
          curl -fsSL -o "$D/charly-linux-amd64" "https://github.com/opencharly/charly/releases/download/$TAG/charly-linux-amd64"
          curl -fsSL -o "$D/charly-plugins-linux-amd64.tar.gz" "https://github.com/opencharly/charly/releases/download/$TAG/charly-plugins-linux-amd64.tar.gz"
          mv "$D/charly-linux-amd64" "$D/bin/charly" && chmod +x "$D/bin/charly"
          tar -xzf "$D/charly-plugins-linux-amd64.tar.gz" -C "$D/plugins"
          echo "$D/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$D/plugins" >> "$GITHUB_ENV"
          CHARLY_PLUGIN_DIR="$D/plugins" "$D/bin/charly" review --self-test

      - name: Run review plan (steps + runtime plugins declared in action-review review-plan.yml)
        id: review
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          AI_REVIEW_PROVIDER: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL:     ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL:  ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MAX_TURNS: ${{ vars.AI_REVIEW_MAX_TURNS || '20' }}
          AI_REVIEW_API_KEY:   ${{ secrets.AI_REVIEW_API_KEY }}
          REVIEW_PROMPT_PATH:  ${{ github.workspace }}/runner-config/prompt/validator.md
          REVIEW_PLAN_PATH:    ${{ github.workspace }}/runner-config/review-plan.yml
          GITHUB_TOKEN:        ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/runner-config"
          charly review --plan "$REVIEW_PLAN_PATH" --out /tmp/review.txt
          # The review TEXT is markdown and its step sections are ###-led lines
          # (e.g. "### [step: review]"): GitHub's $GITHUB_OUTPUT heredoc parser
          # rejects such lines with 'Invalid format' (live distro-omarchy#49
          # evidence) — so the text is NEVER routed through GITHUB_OUTPUT.
          # Same-job consumers (Parse verdict / comment) read /tmp/review.txt.
          verdict=$(grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$' /tmp/review.txt | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "success=true" >> "$GITHUB_OUTPUT"
          [ -n "$verdict" ] && echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Parse verdict
        id: parse
        run: |
          REVIEW=$(cat /tmp/review.txt)
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          [ "$n" -eq 0 ] && { echo "::error::No verdict in response"; exit 2; }
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate (BLOCK)
        if: steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1

      - name: Gate (ambiguous)
        if: steps.parse.outputs.verdict != 'PASS' && steps.parse.outputs.verdict != 'BLOCK'
        run: |
          echo "::error::Ambiguous verdict from AI review"
          exit 2

      # Enable auto-merge — RESILIENTLY. GitHub rejects the mutation with
      # "Pull request is in unstable status" while any required check is still
      # pending/failing, and repos may legitimately carry more than one check
      # besides this one (e.g. a candy CI gate). The REVIEW verdict is already
      # PASS at this point, so arming logistics must never turn the required
      # check red: retry through transient settling states, attempt the
      # update-branch merge when the branch is behind, and soft-skip (warning)
      # when the repository setting does not allow auto-merge.
      - name: Enable auto-merge
        if: steps.parse.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # The job shell runs with -e: a bare failing $( ) assignment would
            # kill the script before the retry loop runs. Capture in a
            # condition context (errexit-immune) instead.
            rc=0
            out=$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" 2>&1) || rc=$?
            echo "attempt $attempt rc=$rc: $out"
            if [ $rc -eq 0 ]; then
              echo "Auto-merge armed"
              exit 0
            fi
            case "$out" in
              *"unstable status"*)
                echo "attempt $att"
                sleep 10
                ;;
              *"is behind"*)
                echo "branch behind — syncing"
                gh pr update-branch "$PR_NUMBER" --repo "$REPO" 2>/dev/null || true
                sleep 15
                ;;
              *"auto-merge is not allowed"*)
                echo "::warning::auto-merge not allowed for this repository — verdict is PASS, merge manually"
                exit 0
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::warning::auto-merge arming did not settle — verdict is PASS, merge manually"
