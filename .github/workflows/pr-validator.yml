# ORG-WIDE PR VALIDATOR (reusable, called via workflow_call)
#
# Validates a PR via AI review. On PASS, enables GitHub native auto-merge
# (squash), which then waits for the branch's REQUIRED checks before merging — and the
# org ruleset (23827016) requires exactly ONE context, `validate / validate`, THIS
# check. A repo's own CI (e.g. `go`) is therefore NOT required and is NOT waited on;
# this comment said otherwise until opencharly/charly#796, the same false premise the
# reviewer rulebook item B18 rested on. Two DETERMINISTIC gates therefore run INSIDE
# this check, before auto-merge is armed, so a PASS now means the head really is green:
#   * gate B reads EVERY check run on this head off the API and fails on any that did
#     not pass, WAITING (bounded) for in-flight ones to settle first;
#   * gate A runs the repo's own DECLARED golangci-lint config over its Go module roots,
#     and skips repos that declare none.
# A repo's own CI stays advisory, exactly as designed. Both gates and their measured
# justification are documented at the steps themselves.
#
# Runs the plugin-review charly plugin to review this PR and gate it with a
# deterministic Verdict: PASS|BLOCK, ONE review comment, $GITHUB_OUTPUT outputs.
# (A policy auto-close step posts a SECOND, distinct notice on the BLOCK threshold or
# on the FIRST INCONCLUSIVE verdict; that notice is not a review comment.)
# The engine invoked is whatever the pinned charly release (vars.CHARLY_VERSION)
# welds. This workflow passes no plan path: the plain `charly review --out ...`
# form is accepted by BOTH the pre-rewrite engine and the embedded-prompt engine,
# so the invocation is weld-independent. The rulebook is supplied ENTIRELY from
# configuration: AI_REVIEW_PROMPT (an opencharly org variable) REPLACES the
# engine's generic embedded default, so no project-specific rule is baked into
# the binary. There is no REVIEW_PROMPT_PATH file mechanism and no
# AI_REVIEW_PROMPT_EXTRA append knob — ONE prompt mechanism.
#
# VERDICT TAXONOMY — these classes are NEVER conflated (a provider that did not
# answer is not a code finding, and it is not a pass either):
#   PASS         -> exit 0, auto-merge armed — ONLY for a review that EXITED 0.
#                   Fail-closed (T3/T4): a non-zero review exit may carry ONLY a
#                   real BLOCK finding; any other verdict such a run wrote is
#                   DISCARDED as untrusted and classified INCONCLUSIVE — a
#                   crashed or stalled review can never arm auto-merge on a
#                   stray PASS line it happened to write.
#   BLOCK        -> exit 1 — a real code finding from the reviewer (a finding is
#                   a finding, whatever the review exit code was).
#   INCONCLUSIVE -> exit 3 — no TRUSTWORTHY verdict was produced: provider
#                   unanswered, a verdict-less review output, or a non-zero
#                   review exit whose output was discarded. NOT a BLOCK and
#                   NOT a pass — the check stays RED (unreviewed code can
#                   never merge).
#   AMBIGUOUS    -> exit 2 — mixed PASS+BLOCK lines in one review, exit 0.
#
# GENERATION BOUNDS — how a review stays inside the job.
# deepseek-v4.1-flash is a REASONING model: nearly all of a review's output is
# reasoning, and its length grows with the PR context — a long review is a
# GENERATION-LENGTH problem, not a scheduling one. The bounds are engine knobs
# (opencharly/plugin-review) that this workflow forwards from org vars, and the
# run's own `request —` debug line reports the values in force (the emitted
# INCONCLUSIVE notice quotes it). THIS COMMENT NAMES NO VALUE, which would drift;
# read them with `gh variable get <NAME> --org opencharly`.
#   * AI_REVIEW_REASONING_EFFORT — the thinking depth. It must STAY SET to a
#     non-empty value until opencharly/plugin-review#36 is welded into the org
#     pin: this workflow forwards an UNSET var as '' (below), and the pinned engine
#     reads THAT ONE knob as "send no reasoning_effort", so the provider applies
#     its own, unbounded, default instead of the declared `high`.
#   * AI_REVIEW_MAX_TOKENS — the shared reasoning+answer budget (unset: the
#     engine default, 262144).
#   * AI_REVIEW_ATTEMPT_TIMEOUT — the whole-request cap on the ONE model call
#     (unset: the engine default, 15m) — and AI_REVIEW_STREAM_IDLE_TIMEOUT, the
#     silence bound between streamed chunks (unset: 3m).
# A cap only DETECTS a generation that is too long; the effort and the token
# budget BOUND it. Raising a cap never fixes an unbounded generation (R4).
#
# THE ACTIVE ENGINE is whatever the org pin vars.CHARLY_VERSION welds — read it
# with `gh variable get CHARLY_VERSION --org opencharly`; this comment names no version,
# because a literal here would drift the moment the pin moves.
# There is NO built-in fallback TAG: ensure-charly uses vars.CHARLY_VERSION verbatim
# (TAG="$CHARLY_VERSION"; it FAILS LOUD, exit 3, when the pin is unset or invisible) and
# replaces any on-PATH charly whose version differs from the pin.
#
# This workflow retries NOTHING in-job (R4): a run that produced no verdict is a
# class to REPORT, not a flake to paper over. The runner image stays
# operator-selectable via vars.REVIEW_RUNNER_LABEL (runs-on: below).
#
# STRUCTURAL ANSWER (this workflow): classify a verdict-less run as INCONCLUSIVE,
# report it plainly on the PR, and keep the required check RED, so it can neither
# pass code nor be mistaken for a code finding. The class comes from the engine's
# OWN terminal line (`inconclusive: …`, plugin-review classify()), which names one
# of three classes — the whole-request cap, an empty completion (the token budget
# spent on reasoning before any answer), or a provider that stopped answering —
# and the emitted comment quotes that line and the engine's `request —` line as
# MEASURED in the run, never a canned narrative (opencharly/.github#133).
# The review TEXT is still NEVER routed through $GITHUB_OUTPUT (see below).
#
# T4 — THIS FILE IS THE ORG-WIDE MERGE GUARDRAIL. A change to it requires
# MAINTAINER SIGN-OFF recorded on the PR (the operator direction is quoted in the
# PR body), not an agent-authored rationale alone. FAIL-CLOSED INVARIANT: PASS —
# and therefore arming auto-merge — requires a review that exited 0; a non-zero
# review exit may only yield BLOCK or INCONCLUSIVE, never PASS.
#
# T13 — THE ENGINE-CHANGE EXCEPTION (opencharly/.github#97). A change to the
# review engine ITSELF (opencharly/plugin-review) cannot be independently reviewed
# BY that engine: the engine is served from a fixed ref, so such a PR would be
# graded by the PRE-change code (observed: the engine's own timeout fix returned the
# very failure it fixed). Such a PR therefore requires the MAINTAINER'S SIGN-OFF
# recorded on the PR and an operator-performed merge — the same posture as T4.
# This is deliberately NOT a bootstrap: serving the engine from the PR head would
# let a PR rewrite the gate so that it approves itself, destroying the independence
# the fresh validator exists to provide. NEVER `gh pr merge --admin`; never an
# agent-performed bypass. The class `engine-defective` below names this condition
# when it occurs, so a defective engine is diagnosed instead of reported as a
# generic verdict-less run.
# No CHANGELOG rename — the merge workflow creates CHANGELOG from PR body.
# No bot tokens needed.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

# NO concurrency here: cancel-in-progress requires the caller to hold actions:
# write, and legacy callers (old dispatchers) lack it — see #163 infra regression.
# The dedupe lives in the per-repo DISPATCHERS, which declare actions: write.
permissions:
  contents: write
  pull-requests: write
  # GATE B reads this head's check runs off the GitHub API. `checks` is its OWN scope —
  # neither `contents` nor `pull-requests` grants it — and a CALLED workflow can only hold
  # what its caller also grants, so the org-wide caller declares it too. Read-only, and the
  # only permission this change adds anywhere.
  checks: read

jobs:
  validate:
    name: validate
    runs-on: ${{ vars.REVIEW_RUNNER_LABEL || 'ubuntu-latest' }}
    # FAIL-HARD wall clock (opencharly/opencharly#199 RCA, 2026-09-12): without
    # this, a provider-unanswered review burns the full plugin-review attempt
    # budget with zero interim output before classifying INCONCLUSIVE — and the
    # GitHub default of 360 would let a doomed run occupy a runner for 6 hours.
    # Observed REVIEWS conclude in 38s-13m19s (the 13m19s run failed — even the
    # slowest observed review, failure included, fits inside 20 with margin).
    # The single 43m54s run (34688719317) was the provider-unanswered burn this
    # cap exists to kill, classified INCONCLUSIVE, not a review. GitHub cancels
    # the job at the cap; the required check
    # goes RED fast instead of hanging pending, and the gate is re-run
    # explicitly (gh workflow run pr-validator.yml -f pr-number=<N>), never
    # retried in-job (R4).
    timeout-minutes: 20
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      - uses: actions/checkout@v7
        with:
          repository: opencharly/action-review
          ref: main
          path: runner-config
          fetch-depth: 1

      - name: "Ensure charly (action-review config repo; self-hosted image: no-op)"
        id: ensure-charly
        env:
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION || '' }}
        run: |
          # ENGINE PIN ENFORCEMENT (the stale-engine gate defect). The gate must run
          # the ORG-PINNED engine (vars.CHARLY_VERSION), because the engine's behaviour
          # lives in the charly binary's WELDED plugin-review: the runaway/empty-completion
          # fix landed in plugin-review v2026.264.1425 (the tool loop deleted), and any
          # charly built before it welds the pre-fix engine that produces no verdict.
          #
          # The former `if command -v charly; then exit 0` trusted ANY on-PATH charly —
          # so on a self-hosted runner whose image bakes an OLD charly (live: charly
          # 2026.256.1316 -> plugin-review v2026.255.1648, the tool-loop engine) the pin
          # was NEVER downloaded, the gate silently ran the stale engine, and every run
          # returned no verdict (INCONCLUSIVE, check RED). An on-PATH charly is now used
          # ONLY when its version EQUALS the pin; otherwise the pinned release is
          # downloaded and PREPENDED to PATH, so the pinned engine always wins.
          if [ -z "${CHARLY_VERSION:-}" ]; then
            echo "::error::vars.CHARLY_VERSION is unset or not visible to this repo — refusing to run an unpinned review engine"
            exit 3
          fi
          TAG="$CHARLY_VERSION"
          WANT="${TAG#v}"   # the pin tag minus its leading 'v': v<CalVer> -> <CalVer>
          if command -v charly >/dev/null 2>&1; then
            HAVE="$(charly version 2>/dev/null | grep -oE '[0-9]{4}\.[0-9]{3}\.[0-9]{4}' | head -1)"
            if [ "$HAVE" = "$WANT" ]; then
              echo "charly on PATH matches the pin ($HAVE) — using it"
              exit 0
            fi
            echo "::warning::on-PATH charly $HAVE != pinned $WANT — downloading the pinned engine (the welded plugin-review differs; a stale engine produces no verdict)"
          fi
          # PINNED charly release - the gate is deterministic; bump here per release.
          # No runtime latest-resolution: the releases/latest redirect is
          # abuse-limited on shared runner IPs (curl exit 22). TAG is
          # vars.CHARLY_VERSION verbatim — there is NO fallback default (an
          # unset/invisible pin fails loud above); and an on-PATH charly is used
          # ONLY when its version EQUALS the pin.
          # PER-RUN dir (runner.temp, wiped between jobs): on self-hosted runners
          # $HOME persists across jobs and a stale plugin binary there crashes
          # the gate (live evidence: plugin-review parseReviewArgs panic, exit 2,
          # while the same tag+tar runs green in a clean dir).
          D="${{ runner.temp }}/charly-$TAG"; mkdir -p "$D/bin" "$D/plugins"
          # release assets are public — tokenless curl (gh/GITHUB_TOKEN injection
          # is unreliable in workflow_call step envs: live smoke exit-4 evidence).
          curl -fsSL -o "$D/charly-linux-amd64" "https://github.com/opencharly/charly/releases/download/$TAG/charly-linux-amd64"
          curl -fsSL -o "$D/charly-plugins-linux-amd64.tar.gz" "https://github.com/opencharly/charly/releases/download/$TAG/charly-plugins-linux-amd64.tar.gz"
          mv "$D/charly-linux-amd64" "$D/bin/charly" && chmod +x "$D/bin/charly"
          tar -xzf "$D/charly-plugins-linux-amd64.tar.gz" -C "$D/plugins"
          echo "$D/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$D/plugins" >> "$GITHUB_ENV"
          # The self-test is a sanity probe, NEVER a hard gate: on self-hosted
          # runners the released plugin-review can panic with a nil-deref in
          # args parsing (live evidence: exit-2 crash with 13 plugin args on the
          # runner while the SAME binary passes a clean ubuntu run). The review
          # step itself re-validates the plugin at use — a bootstrap probe crash
          # must not take the whole org gate down.
          CHARLY_PLUGIN_DIR="$D/plugins" "$D/bin/charly" review --self-test || echo "::warning::bootstrap self-test crashed — continuing (the review step re-validates)"

      - name: Run the review engine (assemble context, verdict)
        id: review
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          AI_REVIEW_PROVIDER: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL:     ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL:  ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          # The engine STREAMS. The meaningful bound is SILENCE between chunks
          # (the idle bound), which this workflow now passes through; the
          # whole-request deadline is left UNSET so the engine's own generous
          # default applies unless an org explicitly overrides it.
          #
          # An org var left UNSET is forwarded as '' (`|| ''`). For the idle
          # bound and the whole-request cap the pinned engine treats '' as unset and
          # applies its default (idle 3m, cap 15m on the ONE model call — the engine
          # makes a single call, there is no turn loop). The job's timeout-minutes
          # wall clock is the last-resort backstop above that cap.
          AI_REVIEW_STREAM_IDLE_TIMEOUT: ${{ vars.AI_REVIEW_STREAM_IDLE_TIMEOUT || '' }}
          AI_REVIEW_ATTEMPT_TIMEOUT: ${{ vars.AI_REVIEW_ATTEMPT_TIMEOUT || '' }}
          # SAMPLING (vendor-recommended for deepseek-v4.1-flash: temp=1.0,
          # top_p=0.95). Forwarded so an operator can TUNE it from an org variable
          # without a rebuild; empty means "the engine's own default". The
          # frequency/presence penalties are the engine's measured guard against
          # degenerate repetition; context tokens/margin size the fail-closed guard.
          AI_REVIEW_TEMPERATURE: ${{ vars.AI_REVIEW_TEMPERATURE || '' }}
          AI_REVIEW_TOP_P: ${{ vars.AI_REVIEW_TOP_P || '' }}
          AI_REVIEW_FREQUENCY_PENALTY: ${{ vars.AI_REVIEW_FREQUENCY_PENALTY || '' }}
          AI_REVIEW_PRESENCE_PENALTY: ${{ vars.AI_REVIEW_PRESENCE_PENALTY || '' }}
          AI_REVIEW_STOP: ${{ vars.AI_REVIEW_STOP || '' }}
          AI_REVIEW_CONTEXT_TOKENS: ${{ vars.AI_REVIEW_CONTEXT_TOKENS || '' }}
          AI_REVIEW_CONTEXT_MARGIN: ${{ vars.AI_REVIEW_CONTEXT_MARGIN || '' }}
          AI_REVIEW_PROMPT: ${{ vars.AI_REVIEW_PROMPT }}
          # MAINTAINER SET — the configured, account-gated sign-off control. The
          # review rulebook (AI_REVIEW_PROMPT) declares the project's maintainer set
          # as CONFIGURATION (the env `AI_REVIEW_MAINTAINER`), NOT as PR content a
          # change asserts for itself: the rulebook's "Maintainer sign-off" section
          # names `AI_REVIEW_MAINTAINER` as the set for this run. The org variable of
          # the same name carries `atrawog,aitrawog`. `vars` resolves in the TARGET
          # repo's context (exact parity with the other AI_REVIEW_* knobs), so a repo
          # may narrow or broaden its own set per-repo; empty means the engine keeps
          # its generic default ("no designated maintainers configured"). The
          # engine's getenvAny resolves an empty forward to "", so `|| ''` means
          # "no override", never "empty set".
          AI_REVIEW_MAINTAINER: ${{ vars.AI_REVIEW_MAINTAINER || '' }}
          AI_REVIEW_POST_COMMENT: ${{ vars.AI_REVIEW_POST_COMMENT || '' }}
          # The GENERATION bounds (owned by the engine). An empty MAX_TOKENS is the
          # engine default (262144). An empty REASONING_EFFORT is NOT, on the
          # pinned engine: it sends no reasoning_effort at all — which is why the
          # org var is SET to `high` (see the header; opencharly/plugin-review#36
          # makes empty mean the default). An operator may override either
          # without a rebuild.
          AI_REVIEW_REASONING_EFFORT: ${{ vars.AI_REVIEW_REASONING_EFFORT || '' }}
          AI_REVIEW_MAX_TOKENS: ${{ vars.AI_REVIEW_MAX_TOKENS || '' }}
          # The OUTPUT/completion cap (distinct from the reasoning+answer budget
          # above). The engine reads AI_REVIEW_MAX_COMPLETION_TOKENS but the gate
          # never forwarded it, so the org could not pin it — forward it now.
          AI_REVIEW_MAX_COMPLETION_TOKENS: ${{ vars.AI_REVIEW_MAX_COMPLETION_TOKENS || '' }}
          # FULL DEBUG TRACE (opt-in via vars). AI_REVIEW_DEBUG makes the engine
          # emit, per turn, the wall time, prompt/context bytes, reasoning bytes,
          # finish_reason, token usage (incl. reasoning tokens) and per-tool
          # name/arg/result sizes; AI_REVIEW_DEBUG_REASONING additionally dumps the
          # reasoning text. This is the observability an RCA needs: without it a
          # long run is three aggregate lines with no per-turn attribution.
          AI_REVIEW_DEBUG: ${{ vars.AI_REVIEW_DEBUG || '' }}
          AI_REVIEW_DEBUG_REASONING: ${{ vars.AI_REVIEW_DEBUG_REASONING || '' }}
          # Session affinity (the pinned engine's x-opencode-session header).
          AI_REVIEW_SESSION_ID: ${{ vars.AI_REVIEW_SESSION_ID || '' }}
          # NOTE: AI_REVIEW_OUT is deliberately NOT forwarded — the review step
          # passes `--out /tmp/review.txt` explicitly, which the engine honours.
          # (No attempt/turn/tool-result knobs are forwarded: the engine makes ONE
          # model call and never retries, so AI_REVIEW_MAX_ATTEMPTS, _MAX_TURNS and
          # _TOOL_RESULT_MAX_BYTES have no reader — R5.)
          AI_REVIEW_API_KEY:   ${{ secrets.AI_REVIEW_API_KEY }}
          GITHUB_TOKEN:        ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/runner-config"

          # /tmp/review.txt is written ONLY by a fully successful review (the
          # engine writes OutPath on the success path, after a verdict) — so clear
          # it first: a stale file must never be parsed as THIS run's verdict.
          rm -f /tmp/review.txt /tmp/review.log

          # bash -e must NOT abort here: a verdict-less run is a CLASS to report,
          # not a crash. Capture the exit code instead. NO RETRY: a retry re-runs
          # the same doomed generation (R4).
          rc=0
          charly review --out /tmp/review.txt > /tmp/review.log 2>&1 || rc=$?
          echo "review rc=$rc"
          cat /tmp/review.log

          # The engine names its terminal class in ONE line (`inconclusive: …`, from
          # plugin-review's classify() / verdictExit() / budgetError()). The class is derived
          # from THAT line's OWN text, so the whole-request cap, an empty completion and a
          # provider stall are never folded into one another (opencharly/.github#133). A
          # marker this workflow keeps no narrative for yields `engine-terminal-other`, and
          # the notice then DEFERS to the engine's own line instead of inventing a cause. The
          # line, and the engine's `request —` line (the bounds in force), are carried to the
          # notice as MEASURED evidence — two bounded lines, never the log.
          terminal=$(grep -m1 -oE 'inconclusive: .*' /tmp/review.log | cut -c1-500 || true)
          request=$(grep -m1 -oE 'request — reasoning_effort=.*' /tmp/review.log | cut -c1-400 || true)
          inconclusive_class=""
          if [ -n "$terminal" ]; then
            case "$terminal" in
              *"exceeded AI_REVIEW_ATTEMPT_TIMEOUT"*)            inconclusive_class="attempt-cap" ;;
              *"produced no answer"*)                            inconclusive_class="empty-completion" ;;
              *"provider never answered or stopped streaming"*)  inconclusive_class="provider-unanswered" ;;
              *)                                                 inconclusive_class="engine-terminal-other" ;;
            esac
          fi
          # provider_unanswered keeps its meaning: the engine SAID the provider stalled — or,
          # ONLY when the engine named no class at all (a step abort, a kill, an HTTP refusal),
          # the log carries a stall marker. The fallback deliberately does NOT match
          # `inconclusive:`: that substring is true for EVERY class the engine names, so
          # matching it here is exactly what folded every class into this one (#133).
          provider_unanswered=false
          if [ "$inconclusive_class" = "provider-unanswered" ]; then
            provider_unanswered=true
          elif [ -z "$terminal" ] &&
             grep -qiE 'provider unanswered|Client[.]Timeout exceeded|context deadline exceeded' /tmp/review.log; then
            provider_unanswered=true
          fi

          verdict=""
          if [ -f /tmp/review.txt ]; then
            verdict=$(grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$' /tmp/review.txt | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u || true)
          fi

          # FAIL-CLOSED on the review exit code (T3/T4): capturing rc must
          # never mean WEAKER than the bash -e it replaced. rc != 0 means the
          # plan did not complete cleanly, so the ONLY class such a run may
          # carry is BLOCK (a real finding, written before the failure). Any
          # other verdict a non-zero run wrote is UNTRUSTWORTHY: a crashed or
          # stalled reviewer must never arm auto-merge on a stray PASS line.
          # That file is moved ASIDE, so Parse verdict finds no verdict and
          # classifies INCONCLUSIVE (exit 3, check RED) — the previous
          # revision let it pass.
          discarded=false
          if [ -n "$verdict" ] && [ "$rc" -ne 0 ] &&
             [ "$verdict" != "BLOCK" ]; then
            discarded=true
            untrusted=$(printf '%s' "$verdict" | tr '\n' '+')
            echo "::warning::review rc=$rc wrote $untrusted — FAIL-CLOSED"
            echo "  discarded: a non-zero review exit may only carry BLOCK"
            mv /tmp/review.txt /tmp/review.untrusted.txt
            verdict=""
          fi

          # The review TEXT is markdown and its step sections are ###-led lines
          # (e.g. "### [step: review]"): GitHub's $GITHUB_OUTPUT heredoc parser
          # rejects such lines with 'Invalid format' (live distro-omarchy#49
          # evidence) — so the text is NEVER routed through GITHUB_OUTPUT.
          # Same-job consumers (Parse verdict / Gates) read /tmp/review.txt.
          # braced group: shellcheck SC2129 (individual appends to one file).
          # engine-defective (opencharly/.github#97): the engine COMPLETED a first turn
          # (the endpoint answered) and failed a LATER turn / produced empty content —
          # the context-dependent class a provider-egress story cannot explain. Naming
          # it keeps a defective engine from being reported as a generic
          # provider-unanswered run (and points at the T13 exception above).
          engine_defective=false
          if [ "$provider_unanswered" = "true" ] &&
             grep -qE 'turn 1: [0-9]+ tool call' /tmp/review.log; then
            engine_defective=true
          fi

          # Provider HTTP rejection (the class a 4xx/5xx actually belongs to): the review
          # client logs `LLM <status>: <body>` when the ENDPOINT parsed the request and
          # REFUSED it — e.g. opencode Go answering 400 MissingSessionID. That is a
          # provider/protocol/configuration matter, NOT the engine streaming class, and the
          # notice below must not assert the streaming story for it (observed 2026-09-12:
          # every org run was reported under a narrative that blamed an already-fixed engine
          # defect while the log carried an explicit HTTP 400).
          provider_error=""
          # [45][0-9][0-9] — 4xx/5xx ONLY. A broader pattern (1xx-5xx) reports a non-refusal
          # status line as a confident provider REJECTION and, because this branch is checked
          # FIRST, preempts the engine-defective class — the same misattribution this notice
          # exists to remove, inverted. The `non-error-status` scenario pins that boundary.
          if pe=$(grep -m1 -oE 'LLM [45][0-9][0-9]' /tmp/review.log); then
            provider_error="${pe#LLM }"
          fi
          {
            echo "review_rc=$rc"
            echo "inconclusive_class=$inconclusive_class"
            echo "engine_terminal=$terminal"
            echo "engine_request=$request"
            echo "provider_unanswered=$provider_unanswered"
            echo "engine_defective=$engine_defective"
            echo "provider_error=$provider_error"
            echo "discarded_verdict=$discarded"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$verdict" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            # ONLY the first line: a multi-line value would break the GITHUB_OUTPUT
            # 'name=value' format. Mixed PASS+BLOCK is classified by Parse verdict.
            first=$(printf '%s\n' "$verdict" | sed -n '1p')
            echo "verdict=$first" >> "$GITHUB_OUTPUT"
            echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::review rc=$rc exited without a BLOCK verdict"
              echo "  INCONCLUSIVE — no BLOCK, no pass; the check stays RED"
            else
              echo "::warning::review rc=0 produced no Verdict line"
              echo "  INCONCLUSIVE — no BLOCK, no pass; the check stays RED"
            fi
          fi

      # Second fail-closed layer (T3/T4): even if a verdict survived in
      # review.txt, a non-zero review exit may only yield BLOCK — anything else
      # this step finds is classified INCONCLUSIVE, never PASS.
      - name: Parse verdict
        id: parse
        env:
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
        run: |
          found=""
          if [ -f /tmp/review.txt ]; then
            found=$(grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$' /tmp/review.txt || true)
          fi
          n=0
          if [ -n "$found" ]; then
            n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          fi
          if [ "$n" -eq 0 ]; then
            # NO Verdict line — never exit 2 blindly here: the two classes behind
            # this (provider unanswered / verdict-less review output) are NOT code
            # findings. Classify INCONCLUSIVE; the Gate (inconclusive) step reports
            # it honestly on the PR and keeps the required check RED.
            echo "verdict=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            echo "::warning::no Verdict line in the review output (provider_unanswered=${{ steps.review.outputs.provider_unanswered }}, review_rc=${{ steps.review.outputs.review_rc }}) — INCONCLUSIVE"
            exit 0
          fi
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          # FAIL-CLOSED (T3/T4): a non-zero review exit may only carry a real
          # BLOCK finding. A PASS — or a mixed PASS+BLOCK — read from a file an
          # rc != 0 run wrote is not a trustworthy pass — INCONCLUSIVE, the
          # check stays RED.
          if [ "${REVIEW_RC:-0}" != "0" ] && [ "$distinct" != "BLOCK" ]; then
            echo "verdict=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            echo "::warning::review rc=${REVIEW_RC}, verdict not BLOCK"
            echo "  FAIL-CLOSED: a non-zero review exit may only carry BLOCK"
            exit 0
          fi
          count=$(printf '%s\n' "$distinct" | wc -l | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            # Mixed PASS+BLOCK: a multi-line value would break the GITHUB_OUTPUT
            # 'name=value' format, so the CLASS is the output.
            echo "verdict=AMBIGUOUS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      # AUTO-CLOSE — the thread-terminator, ONE bound per verdict class (workflow policy):
      #   * ONE `INCONCLUSIVE` closes the PR IMMEDIATELY (`INCONCLUSIVE_THRESHOLD`, 1).
      #     An INCONCLUSIVE is the provider producing NO answer: not a code finding, and
      #     not a pass either — so the only useful move is a CLEAN thread with a single
      #     fresh run, never a second verdict on this one.
      #   * `BLOCK`s keep `AI_REVIEW_AUTO_CLOSE_AFTER` (default 5): a finding IS
      #     actionable on the same thread, so a fixing push is the normal path — and the
      #     bound catches an author who re-pushes without fixing.
      # A PR that keeps collecting verdicts inflates the reviewer's own context with its
      # comment thread and risks a runaway review. Closing at the class bound, with a
      # notice telling the author to open a CLEAN PR FROM SCRATCH (every finding already
      # fixed), bounds that loop for BOTH classes. `AI_REVIEW_AUTO_CLOSE_AFTER=0` (or a
      # non-numeric value) is the ONE off switch and disables auto-close for BOTH classes
      # — the INCONCLUSIVE rule is deliberately NOT carved out of it. Runs BEFORE the
      # BLOCK and INCONCLUSIVE gates so the close + message land, then the matching gate
      # still fails the check (the close is a policy action, not a verdict). The count is
      # the PR's own review comments PLUS this run's own verdict — whose notice the gate
      # posts AFTER this step, which is exactly why this step runs first, and which is
      # what makes ONE INCONCLUSIVE close on its very first run.
      - name: Auto-close (BLOCK threshold or ONE INCONCLUSIVE)
        if: steps.parse.outputs.verdict == 'BLOCK' || steps.parse.outputs.verdict == 'INCONCLUSIVE'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ steps.parse.outputs.verdict }}
          THRESHOLD: ${{ vars.AI_REVIEW_AUTO_CLOSE_AFTER || '5' }}
          # The BLOCK bound is an org variable; the INCONCLUSIVE bound is a CONSTANT of
          # this policy (1) and is deliberately NOT org-configurable: "the provider
          # produced no answer" is a fact about the engine, not a per-repo tuning choice.
          INCONCLUSIVE_THRESHOLD: '1'
        run: |
          case "$THRESHOLD" in
            ''|*[!0-9]*) echo "::warning::AI_REVIEW_AUTO_CLOSE_AFTER=$THRESHOLD is not a number — disabling auto-close"; exit 0;;
          esac
          if [ "$THRESHOLD" -le 0 ]; then
            echo "auto-close disabled (threshold=$THRESHOLD)"
            exit 0
          fi
          inc_threshold="${INCONCLUSIVE_THRESHOLD:-1}"
          case "$inc_threshold" in
            ''|*[!0-9]*) echo "::warning::INCONCLUSIVE_THRESHOLD=$inc_threshold is not a number — the INCONCLUSIVE rule is inactive"; inc_threshold=0;;
          esac
          # Count the validator's OWN verdict comments PER CLASS — the exact
          # "## Review — BLOCK" header AND the exact "## validator INCONCLUSIVE"
          # header every comment carries. The count MUST be page-correct:
          # `gh api --paginate ... --jq` applies the filter PER PAGE (so a
          # >30-comment thread yields several numbers), which the guard below would
          # reject and silently disable auto-close on exactly the long threads this
          # feature exists to bound. `--paginate | jq -s` collects the pages into ONE
          # array first. The two classes are counted SEPARATELY because their bounds
          # differ (ONE INCONCLUSIVE vs AI_REVIEW_AUTO_CLOSE_AFTER BLOCKs).
          counts=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null \
            | jq -s -r '[.[][] | select(.user.login=="github-actions[bot]") | .body] as $b
              | "\(($b | map(select(contains("## Review — BLOCK"))) | length)) \(($b | map(select(contains("## validator INCONCLUSIVE"))) | length))"' 2>/dev/null || true)
          blocks="${counts%% *}"
          inconclusives="${counts##* }"
          case "$blocks" in
            ''|*[!0-9]*) echo "::warning::could not count the BLOCK/INCONCLUSIVE comments (got '$counts') — not auto-closing"; exit 0;;
          esac
          case "$inconclusives" in
            ''|*[!0-9]*) echo "::warning::could not count the BLOCK/INCONCLUSIVE comments (got '$counts') — not auto-closing"; exit 0;;
          esac
          # THIS run's verdict is not in the thread yet (the gate posts its notice after
          # this step), so an INCONCLUSIVE verdict is counted here by construction.
          this_run_inconclusive=0
          if [ "$VERDICT" = "INCONCLUSIVE" ]; then this_run_inconclusive=1; fi
          inc_total=$((inconclusives + this_run_inconclusive))
          nonpass=$((blocks + inc_total))
          echo "BLOCK/INCONCLUSIVE verdicts on this PR: $nonpass ($blocks BLOCK, $inc_total INCONCLUSIVE)"
          echo "bounds — BLOCK=$THRESHOLD (AI_REVIEW_AUTO_CLOSE_AFTER), INCONCLUSIVE=$inc_threshold"
          if [ "$inc_threshold" -gt 0 ] && [ "$inc_total" -ge "$inc_threshold" ]; then
            close_why="ONE \`INCONCLUSIVE\` verdict (INCONCLUSIVE_THRESHOLD=$inc_threshold)"
          elif [ "$blocks" -ge "$THRESHOLD" ]; then
            close_why="${blocks} \`BLOCK\` verdicts (AI_REVIEW_AUTO_CLOSE_AFTER=$THRESHOLD)"
          else
            echo "below both bounds — not closing"
            exit 0
          fi
          msg=$(printf '## Auto-closed: %s non-PASS verdicts on this thread — open a clean PR from scratch\n\n**Closed after** %s.\n\nVerdicts on this thread: **%s** `BLOCK` and **%s** `INCONCLUSIVE` (`AI_REVIEW_AUTO_CLOSE_AFTER=%s` bounds the `BLOCK` class; **ONE** `INCONCLUSIVE` is the `INCONCLUSIVE` bound).\n\n**The rule:** open a clean pull request from scratch — a **fresh branch and a fresh thread** — after **%s `BLOCK` verdicts** (or `AI_REVIEW_AUTO_CLOSE_AFTER`) **or ONE `INCONCLUSIVE` verdict**. Never another push, re-run, or re-open on this thread.\n\n**Why:** every further run on this thread spends a full verdict to say nothing new, and grows this PR'\''s comment thread — which is what drives the reviewer into a runaway. The loop is bounded here instead.\n\n**What to do:**\n1. Fix **every** finding in the `BLOCK` verdict(s) below, **then** open the clean pull request from scratch with those fixes already in.\n2. If the thread is all `INCONCLUSIVE` (no findings — the provider never answered), the close is a **policy bound, not a code finding**: open the clean pull request from scratch once the provider/engine condition is resolved.\n\nThis is a policy action, not a code finding — the validator verdict on this run stands.' "$nonpass" "$close_why" "$blocks" "$inc_total" "$THRESHOLD" "$THRESHOLD")
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$msg" || echo "::warning::could not post the auto-close notice (non-fatal)"
          gh pr close "$PR_NUMBER" --repo "$REPO" || echo "::warning::could not close the PR (non-fatal)"

      - name: Gate (BLOCK)
        if: steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1


      # INCONCLUSIVE is NOT a BLOCK: no code finding was produced — the provider
      # never answered (or the review yielded no Verdict line). Report that plainly
      # on the PR and keep the required check RED: unreviewed code must never
      # merge, and turning this into a pass would silently defeat the gate.
      - name: Gate (inconclusive)
        if: steps.parse.outputs.verdict == 'INCONCLUSIVE'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
          PROVIDER_UNANSWERED: ${{ steps.review.outputs.provider_unanswered }}
          PROVIDER_ERROR: ${{ steps.review.outputs.provider_error }}
          ENGINE_DEFECTIVE: ${{ steps.review.outputs.engine_defective }}
          DISCARDED_VERDICT: ${{ steps.review.outputs.discarded_verdict }}
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
          INCONCLUSIVE_CLASS: ${{ steps.review.outputs.inconclusive_class }}
          ENGINE_TERMINAL: ${{ steps.review.outputs.engine_terminal }}
          ENGINE_REQUEST: ${{ steps.review.outputs.engine_request }}
        run: |
          class="verdict-less review output"
          # Each class carries its OWN root cause; the DEFAULT is EVIDENCE-BOUNDED and
          # asserts no cause the run does not show. The measured engine lines (below the
          # root cause) come from the run itself, never from this template.
          rootcause="**Root cause.** The review plan produced no Verdict line, and this log carries NONE of the recognised signatures: no completed turn 1, no stall marker, and no HTTP rejection. The gate therefore REPORTS the class instead of inventing a cause."
          remedy1="1. open this run's evidence artifact — it holds the full review log and names the failing step;"
          remedy2="2. classify from THAT evidence (a provider status, a stall, a timeout, a crashed plan) rather than from this template."
          # The THREE ENGINE-TERMINAL classes come FIRST, ahead of every workflow-side
          # signature below: the engine's own `inconclusive:` line is the run's direct
          # statement of why it ended, while every branch under it is a heuristic over
          # log signatures. A direct statement outranks a heuristic, so when the engine
          # named the class, that class is the cause and no signature is re-litigated —
          # including the LAST of the three, which defers to a marker this workflow has
          # no narrative for rather than falling through to a signature story.
          # BOTH signals first. A log that shows a COMPLETED turn 1 AND an HTTP rejection is not a
          # plain protocol fault: the refusal lands on a LATER request whose context each turn
          # enlarged — the engine-defective class (opencharly/.github#97) with a specific status,
          # not a denial that the engine ever ran. Ordering this ahead is what makes the
          # single-signal branch's claim below true rather than merely convenient.
          if [ "$INCONCLUSIVE_CLASS" = "attempt-cap" ]; then
            class="whole-request cap (the ONE review call ran past AI_REVIEW_ATTEMPT_TIMEOUT and was cut; not retried)"
            rootcause="**Root cause (measured in this run).** The engine's own terminal line names the class: the generation ran longer than the whole-request cap. A generation that long is a reasoning length problem — compare \`reasoning_effort\` and \`max_tokens\` in the request line below with the org vars (an empty \`reasoning_effort\` means none was sent; opencharly/plugin-review#36)."
            remedy1="1. bound the generation: \`AI_REVIEW_REASONING_EFFORT\` and \`AI_REVIEW_MAX_TOKENS\` (org vars);"
            remedy2="2. raise \`AI_REVIEW_ATTEMPT_TIMEOUT\` only for a legitimately long turn — a cap detects a long generation, it does not bound it (R4)."
          elif [ "$INCONCLUSIVE_CLASS" = "empty-completion" ]; then
            class="empty completion (the token budget was spent on reasoning before any answer; not retryable)"
            rootcause="**Root cause (measured in this run).** The engine's own terminal line names the class: the model used the shared \`max_tokens\` budget on reasoning and produced no answer (opencharly/plugin-review#12). A re-run with the same bounds reproduces it."
            remedy1="1. raise \`AI_REVIEW_MAX_TOKENS\` so reasoning leaves room for the answer, or lower \`AI_REVIEW_REASONING_EFFORT\`;"
            remedy2="2. do not re-run with unchanged bounds — the class is deterministic (R4)."
          elif [ "$INCONCLUSIVE_CLASS" = "engine-terminal-other" ]; then
            class="the engine's own terminal line names the class (this workflow keeps no"
            class="$class narrative for this marker, so it DEFERS to the line): $(printf '%s' "$ENGINE_TERMINAL" | cut -c1-180)"
            rootcause="**Root cause (measured in this run).** The engine classified the run ITSELF, and its terminal line is quoted below. For a marker this workflow has no bespoke narrative for, the gate does not re-derive a cause from a signature: the engine's own line IS the diagnosis, and the instruction that line carries (every engine class names the knob to change) is the remedy. A signature heuristic must never overwrite what the engine stated."
            remedy1="1. act on the instruction in the engine's quoted line above — it names the knob and the direction;"
            remedy2="2. if the marker is one the gate does not recognise, this workflow's decision table is missing a row: report the marker so the table learns it (a new engine class is a contract change, not a wording change)."
          elif [ "$ENGINE_DEFECTIVE" = "true" ] && [ -n "$PROVIDER_ERROR" ]; then
            class="provider rejected a LATER request (HTTP ${PROVIDER_ERROR}) after turn 1 completed — the enlarged-context class (opencharly/.github#97, see the T13 engine-change exception)"
            rootcause="**Root cause.** The engine COMPLETED turn 1 (the endpoint answered) and the provider then REFUSED a later request with **HTTP ${PROVIDER_ERROR}**: each turn appends its tool results to the context, and past a size or rate limit the endpoint rejects the request outright. Both facts are in the diagnostics below. This is therefore NOT reported as a plain protocol fault — the rejection is a SYMPTOM of the unbounded context growth, and the durable fix is the engine's bound on tool-result payloads (owner: plugin-review)."
            remedy1="1. read the provider message in the diagnostics — it names the limit it enforced;"
            remedy2="2. treat it as the context-growth class: raising a cap or retrying does not shrink the request (R4)."
          elif [ -n "$PROVIDER_ERROR" ] && [ "$PROVIDER_UNANSWERED" = "true" ]; then
            class="provider rejected the request (HTTP ${PROVIDER_ERROR}) and another attempt stalled without headers — the unbounded-context class (opencharly/.github#97)"
            rootcause="**Root cause.** This log carries BOTH signatures: the endpoint REFUSED a request with **HTTP ${PROVIDER_ERROR}**, and another attempt stalled without response headers. Neither is asserted alone, because both are the unbounded-context class — each turn appends its tool results, and past a size or rate limit the request is either refused outright or is too large to answer. This is neither a credentials fault nor a blind-retry case."
            remedy1="1. read the provider message in the diagnostics — it names the limit it enforced;"
            remedy2="2. treat it as the context-growth class: raising a cap or retrying does not shrink the request (R4)."
          elif [ -n "$PROVIDER_ERROR" ]; then
            class="provider rejected the request (HTTP ${PROVIDER_ERROR}) — a provider/protocol/config matter, not an engine verdict"
            rootcause="**Root cause.** The model endpoint answered **HTTP ${PROVIDER_ERROR}** — an explicit REJECTION: the provider parsed the request and refused it, and its own message is in the diagnostics below. This log carries NO stall marker (which is what the no-headers class requires) and no completed-turn-1-then-stall pair (which is the engine-defective signature), so neither of those classes describes this run: the rejection itself is the cause."
            remedy1="1. read the provider message in the diagnostics below — it names the missing or wrong element;"
            remedy2="2. fix it at the review client or in the org AI_REVIEW_* variables, then open a CLEAN PR from scratch. An HTTP rejection is deterministic — do NOT retry blindly (R4)."
          elif [ "$ENGINE_DEFECTIVE" = "true" ]; then
            class="engine-defective (the review engine completed turn 1 and failed a later turn — the context-dependent timeout/empty-content class; opencharly/.github#97, see the T13 engine-change exception)"
            rootcause="**Root cause.** The engine COMPLETED turn 1 (the endpoint answered) and a LATER turn failed — the context-dependent class a provider story cannot explain (opencharly/.github#97)."
            remedy1="1. route it to the engine owner (opencharly/plugin-review) with this run's evidence artifact;"
            remedy2="2. an engine change takes the T13 path: maintainer sign-off and an operator-performed merge."
          elif [ "$PROVIDER_UNANSWERED" = "true" ]; then
            class="provider unanswered (the provider stopped answering within the stream-idle bound)"
            rootcause="**Root cause.** The model endpoint stopped answering — no response headers, or a stream that went silent past \`AI_REVIEW_STREAM_IDLE_TIMEOUT\`. That is a provider/endpoint matter, not a code finding."
            remedy1="1. escalate to the operator: the provider and its \`AI_REVIEW_*\` configuration are theirs;"
            remedy2="2. a fresh attempt must be a CLEAN PR from scratch (a fresh branch): this thread is auto-closed by policy on ONE \`INCONCLUSIVE\`, so never re-run or re-open it (R4)."
          elif [ "$DISCARDED_VERDICT" = "true" ]; then
            class="charly review exited rc=${REVIEW_RC} with a non-BLOCK"
            class="$class verdict — FAIL-CLOSED: a non-zero review exit may"
            class="$class only carry a real BLOCK finding, discarded"
            rootcause='**Root cause.** The review exited non-zero and had written a verdict that is NOT BLOCK. That verdict is untrustworthy by construction (T3/T4): a crashed or non-clean run may only carry a real BLOCK finding, so the file was moved aside and the run is reported as INCONCLUSIVE.'
            remedy1="1. open a CLEAN PR from scratch once the engine is healthy — this thread is auto-closed by policy on ONE \`INCONCLUSIVE\`;"
            remedy2="2. never treat a non-zero run PASS as a verdict — fail-closed is by design (T3/T4)."
          fi
          {
            echo '## validator INCONCLUSIVE — no review verdict was produced (not a BLOCK; no code finding)'
            echo
            echo 'The gate could **not** obtain a review verdict on this run, so it produced **no code finding**. This is **not a BLOCK** and the PR is **not** being rejected — but the required check stays **RED on purpose**: unreviewed code must never merge.'
            echo
            echo "- class: $class"
            echo "- review exit code: ${REVIEW_RC:-n/a}"
            echo "- in-job retries: none — the gate REPORTS the class instead of papering over it (R4)"
            echo
            echo "$rootcause"
            echo
            if [ -n "$ENGINE_REQUEST$ENGINE_TERMINAL" ]; then
              echo "**Measured in this run** (the engine's own lines):"
              echo
              echo '```text'
              if [ -n "$ENGINE_REQUEST" ]; then echo "$ENGINE_REQUEST"; fi
              if [ -n "$ENGINE_TERMINAL" ]; then echo "$ENGINE_TERMINAL"; fi
              echo '```'
              echo
            fi
            echo '**Durable remedy.**'
            echo "$remedy1"
            echo "$remedy2"
            echo
            echo '**Thread policy.** A thread gets ONE run per verdict: the auto-close step closes this PR on **ONE `INCONCLUSIVE`** (and on `AI_REVIEW_AUTO_CLOSE_AFTER` `BLOCK`s), so the next attempt must be a **clean PR from scratch** — a fresh branch and a fresh thread — with every finding already fixed. Never re-run or re-open this thread.'
            echo
            echo 'A run that produced no verdict keeps this required check **RED**: unreviewed code must never merge.'
            echo
            # The review-log diagnostics are deliberately NOT embedded in this comment.
            # A degenerate-repetition run carries hundreds of KB of "Hmm." noise (measured:
            # ~467 KB / 83k lines on the real context), and THIS comment is re-ingested into
            # the NEXT review's context (the engine reads every PR comment), so embedding the
            # runaway made the next review collapse harder — a positive feedback loop. The
            # full diagnostics live in this run's uploaded EVIDENCE artifact and the job log,
            # neither of which a later review reads. Keeping this notice short is the durable
            # fix for the loop; see opencharly/charly#712.
            echo "_Full diagnostics: this run's **evidence artifact** + job log (not embedded here — embedding a runaway log would feed it into the next review and deepen the collapse)._"
          } > /tmp/inconclusive-comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/inconclusive-comment.md || echo "::warning::could not post the INCONCLUSIVE comment (non-fatal)"
          echo "::error::validator INCONCLUSIVE — no review verdict was produced (not a BLOCK; no code finding) — see the PR comment"
          exit 3

      - name: Gate (ambiguous)
        if: steps.parse.outputs.verdict != 'PASS' && steps.parse.outputs.verdict != 'BLOCK' && steps.parse.outputs.verdict != 'INCONCLUSIVE'
        run: |
          echo "::error::Ambiguous verdict from AI review (mixed PASS+BLOCK, or an unparsable verdict output)"
          exit 2

      # ---------------------------------------------------------------------------
      # THE TWO DETERMINISTIC GATES THAT MAKE A `PASS` MEAN "the head is green"
      # (opencharly/charly#796).
      #
      # WHY THEY ARE HERE, INSIDE THE ONE REQUIRED CHECK. Checklist item B18 used to tell
      # the reviewer that "CI status is NOT a review input ... branch protection enforces
      # the repo's required checks mechanically". MEASURED, that premise was FALSE: the ONE
      # org ruleset (23827016) requires exactly ONE context — `validate / validate` — so a
      # repo's own `ci` job was enforced by NOBODY: not by branch protection, and (on B18's
      # explicit instruction) not by the reviewer either. MEASURED cost, two merged heads:
      #   charly#795 — `go` FAILED at 02:35:42Z; the review PASSed at 02:44:58Z, 9m16s LATER,
      #                and the merge landed at 02:45:21Z on that already-red head.
      #   charly#791 — the merge landed at 21:25:04Z while `go` was STILL RUNNING; `go` then
      #                failed at its Test step at 21:27:24Z, 2m20s AFTER the merge.
      # #791 is why gate B below WAITS rather than taking a snapshot: at gate time the doomed
      # check was `in_progress`, not `failure`, so a snapshot would have missed it entirely.
      #
      # GATE B — EVERY CHECK ON THIS HEAD, read from the GitHub API. Generic by construction:
      # it reproduces whatever gate the repo declares, with no linter, no checkout and no
      # per-repo coupling. It WAITS, bounded, for in-flight checks to finish — because the
      # review is FASTER than the repo's own CI in 4 of 5 sampled PRs (`validate` 0m40s–14m15s
      # vs `go` 3m57s–5m11s), so failing closed the instant a check is pending would block
      # most PRs. A check that is absent is of course not evidence of anything, so a repo
      # with no other checks at all is unaffected.
      #
      # GATE A — THE REPO'S DECLARED LINT. Gate B cannot see a repo that declares a lint
      # policy nothing ever runs (MEASURED: `plugin-check` carries `.golangci.yml` and its only
      # workflow is `tag-on-merge.yml`). Gate A runs golangci-lint over each Go module root
      # that has a DECLARED config — and SKIPS the rest, because falling back to
      # golangci-lint's standard set would impose a NEW gate on repos that never linted:
      # MEASURED, 6 of 8 sampled org repos holding a `go.mod` and NO config FAIL that standard
      # set (`SA1019` in a generated `schema_splice_test.go` scaffold, `errcheck` on tests,
      # one `typecheck`). The repo's own CI stays advisory, exactly as designed.
      #
      # CONFIG SELECTION IS THE SUBTLE PART — measured, and it decided the design.
      # golangci-lint resolves its config by walking UP from its CWD, so `cd <module root>` is
      # NOT what a repo's CI does. charly carries TWO configs: `charly/.golangci.yml` (the
      # baseline its CI resolves, running `run ./charly/...` from the repo root) and the
      # stricter curated `charly/charly/.golangci.yml`. Same commit: root config -> `0 issues`;
      # the module's own -> `2 issues`. A naive `cd` gate would falsely red charly itself. So:
      #   * a config at the repo root IS the repo-level policy and is applied to every module;
      #   * with no root config, each module uses the config it declares itself (walk-up);
      #   * a module with neither is SKIPPED — it has declared no lint policy.
      # `GOWORK=off` is REQUIRED: charly's 5 `tools/*` modules are not members of
      # `charly/go.work` (`use ./charly` only), so without it the gate ERRORS on them instead
      # of linting. With both corrections, all six charly module roots yield `0 issues`.
      # gofmt is deliberately NOT asserted separately: it is a FORMATTER, enabled by the
      # repo's OWN config (charly's enables it), and inventing a gofmt gate for repos that
      # chose differently would be new policy, not enforcement.
      #
      # BOTH GATE THE MERGE ONLY, guarded exactly like "Enable auto-merge" below: they run
      # after the verdict gates, so the review, its comment and the auto-close counter are
      # untouched — a failure blocks ARMING AUTO-MERGE and turns the check red; it does not
      # suppress or replace the verdict.
      #
      # THE CHECKOUT IS A SUBPATH (`pr-head`), never the workspace root: the review step
      # runs from `$GITHUB_WORKSPACE/runner-config`, and a self-modifying gate must not
      # change what its own review input looks like.
      # ---------------------------------------------------------------------------
      - uses: actions/checkout@v7
        if: steps.parse.outputs.verdict == 'PASS'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      # ----- GATE A — the repo's DECLARED lint (see the block comment above) -----------

      - name: "Detect Go modules under a declared golangci-lint config (skip cleanly otherwise)"
        id: go-modules
        if: steps.parse.outputs.verdict == 'PASS'
        run: |
          # A config at the repo ROOT is the repo-level policy and governs every module
          # below it. This is the resolution charly's own CI gets (it runs from the repo
          # root), and it is why the gate does not simply `cd` into each module: the
          # module's own closer config is a DIFFERENT, stricter policy (see the block
          # comment above — it is the difference between `0 issues` and `2 issues`).
          root_cfg=""
          if [ -f pr-head/.golangci.yml ]; then
            root_cfg="pr-head/.golangci.yml"
          elif [ -f pr-head/.golangci.yaml ]; then
            root_cfg="pr-head/.golangci.yaml"
          fi

          # GNU find on every GitHub-hosted runner. `-prune` the .git and vendor trees: a
          # vendored tree carries nested go.mod files that are NOT modules of this repo.
          # `|| true` is load-bearing — an absent or unreadable tree must yield an EMPTY
          # list and a clean skip, never abort the step under the job shell's -e.
          mods="$(find pr-head \( -name .git -o -name vendor \) -prune -o -name go.mod -printf '%h\n' 2>/dev/null | sort || true)"

          # Keep a module ONLY when a config governs it: the repo-root one, or one it
          # declares itself inside the repo (walk-up, exactly golangci-lint's own rule).
          # A module with neither is SKIPPED, because falling back to golangci-lint's
          # standard set would impose a NEW gate on a repo that has never linted.
          roots=""
          while IFS= read -r m; do
            if [ -z "$m" ]; then continue; fi
            if [ -n "$root_cfg" ]; then
              roots="${roots}${m}"$'\n'
              continue
            fi
            d="$m"
            while :; do
              if [ -f "$d/.golangci.yml" ] || [ -f "$d/.golangci.yaml" ]; then
                roots="${roots}${m}"$'\n'
                break
              fi
              if [ "$d" = "pr-head" ]; then break; fi
              d="$(dirname "$d")"
            done
          done <<< "$mods"

          if [ -z "$roots" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no Go module under a declared golangci-lint config in ${GITHUB_REPOSITORY} — the declared-lint gate is skipped (a repo's own CI stays advisory, as designed)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "config=$root_cfg" >> "$GITHUB_OUTPUT"
            {
              echo "roots<<__MODULE_ROOTS__"
              printf '%s' "$roots"
              echo "__MODULE_ROOTS__"
            } >> "$GITHUB_OUTPUT"
            # No apostrophe inside ${...:-...}: bash treats a quote character in the word
            # part of a parameter expansion as a QUOTE, which breaks the whole script.
            echo "Go module roots to lint (config: ${root_cfg:-per-module}):"
            printf '%s\n' "$roots"
          fi

      - uses: actions/setup-go@v5
        if: steps.parse.outputs.verdict == 'PASS' && steps.go-modules.outputs.present == 'true'
        with:
          # 'stable': the module roots are discovered at RUN time, so there is no static
          # path to hand go-version-file; a module declaring an older toolchain still
          # resolves through Go's own toolchain directive.
          go-version: 'stable'

      - name: "golangci-lint (the repo's declared lint, enforced)"
        id: golint
        if: steps.parse.outputs.verdict == 'PASS' && steps.go-modules.outputs.present == 'true'
        # Its OWN wall clock, so a hung linter fails fast instead of consuming the job's
        # timeout-minutes backstop — which exists for a provider-unanswered REVIEW.
        timeout-minutes: 12
        env:
          GOLANGCI_LINT_VERSION: ${{ vars.GOLANGCI_LINT_VERSION || 'v2.13.2' }}
          GO_MODULE_ROOTS: ${{ steps.go-modules.outputs.roots }}
          GO_MODULE_CONFIG: ${{ steps.go-modules.outputs.config }}
        run: |
          # The pin defaults to v2.13.2 — the version BOTH org repos that lint today pin
          # in their own CI (charly, spec). An operator moves it for the WHOLE org with
          # `gh variable set GOLANGCI_LINT_VERSION --org opencharly`. The release tarball
          # is public, so the fetch is tokenless (the same reason ensure-charly curls
          # rather than using gh).
          VER="${GOLANGCI_LINT_VERSION#v}"
          D="${{ runner.temp }}/golangci-lint-$VER"
          mkdir -p "$D"
          curl -fsSL -o "$D/lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v$VER/golangci-lint-$VER-linux-amd64.tar.gz"
          tar -xzf "$D/lint.tar.gz" -C "$D"
          BIN="$D/golangci-lint-$VER-linux-amd64/golangci-lint"
          "$BIN" version

          fail=0
          # A here-string, never a pipe: the loop body must run in THIS shell, or `fail`
          # would be lost in a subshell and the gate would always exit green.
          while IFS= read -r root; do
            if [ -z "$root" ]; then continue; fi
            echo "== golangci-lint: $root =="
            if [ -n "$GO_MODULE_CONFIG" ]; then
              # The repo-level policy, applied explicitly so it cannot be shadowed by a
              # closer module config (golangci-lint would otherwise resolve that one).
              ( cd "$root" && GOWORK=off "$BIN" run --config "$GITHUB_WORKSPACE/$GO_MODULE_CONFIG" ./... ) || fail=1
            else
              # No repo-level policy: let golangci-lint resolve the module's own config by
              # walking up, which is exactly the one the detection step matched on.
              ( cd "$root" && GOWORK=off "$BIN" run ./... ) || fail=1
            fi
          done <<< "$GO_MODULE_ROOTS"
          if [ "$fail" -ne 0 ]; then
            echo "::error::the declared-lint gate FAILED — fix the findings above and push; auto-merge is NOT armed"
          fi
          exit $fail

      # ----- GATE B — every check on this head (see the block comment above) -----------

      - name: "Head check-runs (wait for the head to settle, then fail on any check that did not pass)"
        id: head-checks
        if: steps.parse.outputs.verdict == 'PASS'
        # Its OWN wall clock: the wait below is bounded, this is the backstop should the
        # API hang rather than answer.
        timeout-minutes: 14
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          WAIT_BUDGET_SECONDS: '600'
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28")

          # This gate must not count ITSELF: its own check run is `in_progress` for the whole
          # time it polls, so counting it would make every PR wait the full budget and then
          # fail. TWO discriminators, belt and braces, because the failure mode of getting
          # this wrong is every PR in the org:
          #   (1) `details_url` carries this run's id — MEASURED on a live head: the check run
          #       `validate / validate` had details_url
          #       `.../actions/runs/37257260832/job/111596907011`, and 37257260832 IS the
          #       `charly/pr-validator` run for that head. A job-level `uses:` runs INSIDE the
          #       caller's run, so GITHUB_RUN_ID is the same number here. Exact, and it needs
          #       no extra permission (no `actions: read`, no suite lookup).
          #   (2) the org's required context BY NAME. A check can never be evidence about
          #       itself, the newest attempt for this name is always the run polling here, and
          #       this workflow IS the owner of that context — so dropping it loses no signal
          #       even if (1) ever stopped holding (e.g. a caller that renames its job).
          self_url="/runs/${GITHUB_RUN_ID}"
          self_ctx="validate / validate"

          # MEASURED — do NOT use `filter=latest` here. GitHub's `latest` filter returns the
          # newest check run per (app, name) — which is the semantics this gate wants — but
          # during a RE-RUN of a workflow it briefly drops that name ENTIRELY: the superseded
          # attempt is removed before its successor is created. Polled directly against the
          # live API on a re-run, two consecutive polls returned `latest: []` (the name gone)
          # while `filter=all` returned the six completed attempts. A gate reading `latest`
          # therefore sees an EMPTY check set in that window, concludes "nothing is pending,
          # nothing failed", and arms auto-merge on a head whose check is mid-re-run — the
          # #791 hole re-opened. `filter=all` + `max_by(.id)` reproduces `latest`'s
          # newest-per-name semantics WITHOUT the window: check-run ids are monotonically
          # increasing (verified), so the newest attempt stays visible at every instant.
          # The 100-run page cap is the only residual limit; a head would need >100 attempts
          # across ALL of its workflows to truncate, and per-name the list is newest-first.
          snapshot() {
            curl -fsS "${auth[@]}" \
              "${api}/commits/${HEAD_SHA}/check-runs?per_page=100&filter=all" \
            | jq --arg self "$self_url" --arg selfctx "$self_ctx" -c '
                [ .check_runs[] | select((.details_url // "") | contains($self) | not)
                                 | select(.name != $selfctx) ]
                | group_by(.name + "\u0000" + (.app.slug // ""))
                | map(max_by(.id))
                | { pending: [ .[] | select(.status != "completed") | .name ],
                    bad:     [ .[] | select(.status == "completed"
                                            and (.conclusion as $c
                                                 | ["success","neutral","skipped"] | index($c) | not))
                                     | "\(.name) -> \(.conclusion)" ],
                    all:     [ .[] | "\(.name) -> \(.status)/\(.conclusion)" ],
                    total:   length }'
          }

          deadline=$(( $(date +%s) + WAIT_BUDGET_SECONDS ))
          while :; do
            if ! snap="$(snapshot)"; then
              echo "::error::could not read the check runs for ${HEAD_SHA} — refusing to arm auto-merge on an unread head"
              exit 1
            fi
            npending="$(jq -r '.pending | length' <<<"$snap")"
            if [ "$npending" -eq 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then break; fi
            echo "waiting on ${npending} in-flight check(s): $(jq -r '.pending | join(", ")' <<<"$snap")"
            sleep 15
          done

          echo "check runs on ${HEAD_SHA} in ${GITHUB_REPOSITORY} (this gate excluded):"
          jq -r '.all[]' <<<"$snap"

          nbad="$(jq -r '.bad | length' <<<"$snap")"
          if [ "$nbad" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::a check on this head did not pass — ${line}"; done < <(jq -r '.bad[]' <<<"$snap")
            echo "::error::${nbad} check(s) on this head did not pass. Auto-merge is NOT armed — fix them and push."
            exit 1
          fi

          if [ "$npending" -ne 0 ]; then
            echo "::error::could not confirm this head is green: still in flight after ${WAIT_BUDGET_SECONDS}s — $(jq -r '.pending | join(", ")' <<<"$snap")"
            echo "::error::re-run this check once they finish (a push, or a REST re-run of this workflow run, re-evaluates it)."
            exit 1
          fi

          echo "all $(jq -r '.total' <<<"$snap") check run(s) on this head passed — safe to arm auto-merge"

      # Enable auto-merge — RESILIENTLY. GitHub rejects the mutation with
      # "Pull request is in unstable status" while any required check is still
      # pending/failing, and repos may legitimately carry more than one check
      # besides this one (e.g. a candy CI gate). The REVIEW verdict is already
      # PASS at this point, so arming logistics must never turn the required
      # check red: retry through transient settling states, attempt the
      # update-branch merge when the branch is behind, and soft-skip (warning)
      # when the repository setting does not allow auto-merge.
      - name: Enable auto-merge
        if: steps.parse.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # The job shell runs with -e: a bare failing $( ) assignment would
            # kill the script before the retry loop runs. Capture in a
            # condition context (errexit-immune) instead.
            rc=0
            out=$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" 2>&1) || rc=$?
            echo "attempt $attempt rc=$rc: $out"
            if [ $rc -eq 0 ]; then
              echo "Auto-merge armed"
              exit 0
            fi
            case "$out" in
              *"unstable status"*)
                echo "attempt $attempt unstable — retrying"
                sleep 10
                ;;
              *"is behind"*)
                echo "branch behind — syncing"
                gh pr update-branch "$PR_NUMBER" --repo "$REPO" 2>/dev/null || true
                sleep 15
                ;;
              *"auto-merge is not allowed"*)
                echo "::warning::auto-merge not allowed for this repository — verdict is PASS, merge manually"
                exit 0
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::warning::auto-merge arming did not settle — verdict is PASS, merge manually"

      # ---------------------------------------------------------------------------
      # FAILURE EVIDENCE (always). The INCONCLUSIVE notice carries only the last 25
      # lines of the review log, and a run log is transient — so a failure deep in a
      # long review (turn 7 of a 20-turn loop; a provider rejection mid-plan) is only
      # findable by scrolling an expiring log. This step preserves the FULL evidence as
      # a downloadable artifact AND puts the class + the effective configuration on the
      # run own Summary page, so a reader never has to guess WHICH log to open — the gap
      # that made the 2026-09-12 org-wide outage (an HTTP 400 the model endpoint named
      # explicitly) take longer to diagnose than the evidence warranted.
      # ---------------------------------------------------------------------------
      - name: Evidence bundle (always)
        id: evidence
        if: always()
        # A REPORTING path must never change the verdict: without this, a failure inside the
        # evidence step would fail the job and turn a PASS run RED. The workflow contract is
        # explicit — a run that produced a verdict keeps its required check green.
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
          PROVIDER_ERROR: ${{ steps.review.outputs.provider_error }}
          PROVIDER_UNANSWERED: ${{ steps.review.outputs.provider_unanswered }}
          ENGINE_DEFECTIVE: ${{ steps.review.outputs.engine_defective }}
          DISCARDED_VERDICT: ${{ steps.review.outputs.discarded_verdict }}
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          ATTEMPT_TIMEOUT: ${{ vars.AI_REVIEW_ATTEMPT_TIMEOUT }}
          # The abort evidence — which runner this job landed on, and whether the review
          # step ever ran. Measured live (opencharly/.github#158): one head's run on
          # `charly-githubrunner-no-4` executed 14 steps in 2m42s and produced an EMPTY
          # manifest (no `review.log`, empty `review_rc`), while every run on `-no-1` ran
          # 15 steps and produced 1330-1917 lines of review. This artifact is the only
          # machine-readable output for this ruleset workflow (`gh run view`/`gh run
          # rerun` 404 on it), so it must carry the fields that name an early abort.
          RUNNER_NAME: ${{ runner.name }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          D="${RUNNER_TEMP}/validator-evidence"
          mkdir -p "$D"
          # The manifest is the machine-readable answer to "what happened": the class
          # inputs, the exit code, the provider/model/base_url ACTUALLY in force, and the
          # file inventory. Written even when a log is missing — an absent file is itself
          # evidence (a 3-line review log means the review never started; 500 lines mean it
          # ran and failed partway).
          {
            echo "repo=${REPO}"
            echo "pr=${PR_NUMBER}"
            echo "review_rc=${REVIEW_RC:-}"
            echo "provider_error=${PROVIDER_ERROR:-}"
            echo "provider_unanswered=${PROVIDER_UNANSWERED:-}"
            echo "engine_defective=${ENGINE_DEFECTIVE:-}"
            echo "discarded_verdict=${DISCARDED_VERDICT:-}"
            echo "vars_charly_version=${CHARLY_VERSION:-<unset>}"
            echo "vars_ai_review_provider=${AI_REVIEW_PROVIDER:-<unset>}"
            echo "vars_ai_review_model=${AI_REVIEW_MODEL:-<unset>}"
            echo "vars_ai_review_base_url=${AI_REVIEW_BASE_URL:-<unset>}"
            echo "vars_ai_review_attempt_timeout=${ATTEMPT_TIMEOUT:-<unset>}"
            echo "runner_name=${RUNNER_NAME:-<unset>}"
            echo "step_outcome_review=${REVIEW_OUTCOME:-<unset>}"
          } > "$D/manifest.txt"
          for f in /tmp/review.log /tmp/review.txt /tmp/review.untrusted.txt; do
            b=$(basename "$f")
            if [ -f "$f" ]; then cp "$f" "$D/$b"; else echo "(absent)" > "$D/$b.absent"; fi
          done
          wc -l /tmp/review.log 2>/dev/null > "$D/review.log.lines" || echo "0" > "$D/review.log.lines"
          echo "evidence dir:"; ls -la "$D"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## Validator evidence"
              echo
              echo "| field | value |"
              echo "|---|---|"
              # Backticks are markdown code spans here, NOT command substitution: inside a
              # double-quoted echo they must be ESCAPED, or bash tries to run the markdown
              # as commands (the offline harness caught exactly that: "line 34: 0: command
              # not found"). Single quotes cannot be used because these lines expand ${VAR}.
              echo "| review exit code | \`${REVIEW_RC:-n/a}\` |"
              echo "| provider HTTP error | \`${PROVIDER_ERROR:-none}\` |"
              echo "| runner | \`${RUNNER_NAME:-n/a}\` |"
              echo "| step \`Run the review engine\` | \`${REVIEW_OUTCOME:-n/a}\` |"
              echo "| class inputs | provider_unanswered=\`${PROVIDER_UNANSWERED:-}\` engine_defective=\`${ENGINE_DEFECTIVE:-}\` discarded=\`${DISCARDED_VERDICT:-}\` |"
              echo "| provider / model / base_url | \`${AI_REVIEW_PROVIDER:-<unset>}\` / \`${AI_REVIEW_MODEL:-<unset>}\` / \`${AI_REVIEW_BASE_URL:-<unset>}\` |"
              echo "| attempt-cap var | \`${ATTEMPT_TIMEOUT:-<unset>}\` |"
              echo
              echo "**Evidence:** the artifact named \`validator-evidence\` holds the FULL review log and the verdict files; the PR comment carries the class and the last 25 log lines."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        # Same reason as the bundle above: an artifact-service hiccup must not fail a PASS run.
        continue-on-error: true
        # Pinned to the v4 tag's commit, the tightest form this org already uses elsewhere
        # (actions/create-github-app-token in tag-on-merge.yml is SHA-pinned). No new secret,
        # no new permission: the artifact service uses the job's own runtime token, and
        # if-no-files-found: ignore keeps a missing bundle from failing the step.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validator-evidence
          path: ${{ runner.temp }}/validator-evidence
          if-no-files-found: ignore
          retention-days: 14
