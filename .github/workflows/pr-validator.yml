# ORG-WIDE PR VALIDATOR (reusable, called via workflow_call)
#
# Validates a PR via AI review. On PASS, enables GitHub native auto-merge
# (squash). GitHub branch protection waits for all required checks
# (including repo-specific CI gates like verify/go) before merging.
#
# Runs the plugin-review charly plugin (the action-review cutover, replacing
# opencharly/pi-review-action): read-only GitHub tools, deterministic
# Verdict: PASS|BLOCK, ONE PR comment, $GITHUB_OUTPUT outputs. WHICH plugins/
# steps run is declared in opencharly/action-review@main:prompt/validator.md +
# review-plan.yml (charly review --plan); this workflow never changes for that.
#
# VERDICT TAXONOMY — these classes are NEVER conflated (a provider that did not
# answer is not a code finding, and it is not a pass either):
#   PASS         -> exit 0, auto-merge armed — ONLY for a review that EXITED 0.
#                   Fail-closed (T3/T4): a non-zero review exit may carry ONLY a
#                   real BLOCK finding; any other verdict such a run wrote is
#                   DISCARDED as untrusted and classified INCONCLUSIVE — a
#                   crashed or stalled review can never arm auto-merge on a
#                   stray PASS line it happened to write.
#   BLOCK        -> exit 1 — a real code finding from the reviewer (a finding is
#                   a finding, whatever the review exit code was).
#   INCONCLUSIVE -> exit 3 — no TRUSTWORTHY verdict was produced: provider
#                   unanswered, a verdict-less review output, or a non-zero
#                   review exit whose output was discarded. NOT a BLOCK and
#                   NOT a pass — the check stays RED (unreviewed code can
#                   never merge).
#   AMBIGUOUS    -> exit 2 — mixed PASS+BLOCK lines in one review, exit 0.
#
# RCA 2026-09-12 (CORRECTED — supersedes the 2026-09-11 "throttled datacenter
# egress" diagnosis, which was WRONG; opencharly/.github#91 carries the corrected
# RCA and the endpoint probe that refutes it).
# Symptom: validator runs dying with "context deadline exceeded (Client.Timeout
# exceeded while awaiting headers)" — no verdict, the required check RED.
#
# ROOT CAUSE: a NON-STREAMING request under a WHOLE-GENERATION deadline.
# plugin-review POSTs to the provider's /chat/completions with no `stream:true`
# (candy/plugin-review/llm.go:92), so the client receives response headers only
# after the ENTIRE generation has finished — all under ONE http.Client{Timeout}
# (llm.go:80) whose built-in default is 5 minutes (review.go:28,
# defaultAttemptTimeout). The review runs inside a 20-turn tool loop (review.go,
# defaultMaxTurns = 20) in which every turn APPENDS its tool results (the PR
# diff/files) to the context, and the WHOLE loop is retried as 3 attempts
# (review.go). Turn 1 therefore succeeds quickly ("turn 1: 4 tool call(s)"), and
# turn 2 — carrying the ENLARGED context — fails in ONE OF TWO OBSERVED ways, both
# rooted in the same non-streaming whole-generation design:
#   (a) the generation returns EMPTY content ("turn 2: final content len=0",
#       review_len=0) — observed on 2 of the 3 attempts in run 34682776608; or
#   (b) it exceeds the 5-minute cap ("Client.Timeout ... while awaiting headers")
#       — observed on the third attempt of that run.
# The observed signature is therefore a COMPLETED turn 1 followed by a turn-2
# failure of EITHER kind. Both are one defect class — an unbounded, non-streaming
# request whose context grew — and the fix covers both: streaming bounds the idle
# gap instead of the whole generation, and bounded tool-result payloads keep turn
# 2's context small enough to answer at all.
#
# The endpoint was NEVER the problem: it answered 405 in 0.18s from a residential
# path in the same window, and this runner DID receive a complete turn-1
# response. There is no such thing as a "throttled egress" here. The contributing
# defects are client-side: no explicit http.Transport (a stale keep-alive POST can
# hang to the deadline), UNBOUNDED tool-result payloads, and a retry that re-runs
# the WHOLE loop instead of the failed turn.
#
# THE FIX, TWO HALVES. (i) THIS workflow PASSES the cap through:
# AI_REVIEW_ATTEMPT_TIMEOUT, org-settable, default 300s (= the plugin's own
# built-in default, review.go:28): a single generation needing more than 5
# minutes has never been observed to succeed — the recorded failures are
# generations that NEVER answer — so the cap is a deadline, not a budget.
# (ii) The durable
# per-turn fixes — STREAM the completion, set an explicit http.Transport, BOUND
# the tool-result payloads, and retry the FAILED TURN rather than the whole loop
# — belong to plugin-review (owner: plugin-review).
#
# This workflow still retries NOTHING in-job (R4): a run that produced no verdict
# is a class to REPORT, not a flake to paper over. The runner image stays
# operator-selectable via vars.REVIEW_RUNNER_LABEL (runs-on: below).
#
# STRUCTURAL ANSWER (this workflow): classify a provider-unanswered run as
# INCONCLUSIVE, report it plainly on the PR, and keep the required check RED, so
# a run that produced no verdict can neither silently pass code nor be mistaken
# for a code finding. The classification consumes plugin-review's explicit terminal marker,
# carried by the pinned charly release below. The marker is THREE ADJACENT
# STRING CONSTANTS in the bundled plugin-review binary — `strings` reports
# each one verbatim, and the exact commands + their full output are in this
# PR's body:
#   1. "inconclusive: all %d attempts timed out "
#   2. " the LLM provider did not respond within the attempt timeout (provider unanswered); this is NOT a review verdict "
#   3. " re-run the gate"
# The runtime message is 1 + 2 + 3 (the header states this so the pin's claim is
# checkable against the published asset, never taken on trust).
# The review TEXT is still NEVER routed through $GITHUB_OUTPUT (see below).
#
# T4 — THIS FILE IS THE ORG-WIDE MERGE GUARDRAIL. A change to it requires
# MAINTAINER SIGN-OFF recorded on the PR (the operator direction is quoted in the
# PR body), not an agent-authored rationale alone. FAIL-CLOSED INVARIANT: PASS —
# and therefore arming auto-merge — requires a review that exited 0; a non-zero
# review exit may only yield BLOCK or INCONCLUSIVE, never PASS.
#
# T13 — THE ENGINE-CHANGE EXCEPTION (opencharly/.github#97). A change to the
# review engine ITSELF (opencharly/plugin-review) cannot be independently reviewed
# BY that engine: the engine is served from a fixed ref, so such a PR would be
# graded by the PRE-change code (observed: the engine's own timeout fix returned the
# very failure it fixed). Such a PR therefore requires the MAINTAINER'S SIGN-OFF
# recorded on the PR and an operator-performed merge — the same posture as T4.
# This is deliberately NOT a bootstrap: serving the engine from the PR head would
# let a PR rewrite the gate so that it approves itself, destroying the independence
# the fresh validator exists to provide. NEVER `gh pr merge --admin`; never an
# agent-performed bypass. The class `engine-defective` below names this condition
# when it occurs, so a defective engine is diagnosed instead of reported as a
# generic verdict-less run.
# No CHANGELOG rename — the merge workflow creates CHANGELOG from PR body.
# No bot tokens needed.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

# NO concurrency here: cancel-in-progress requires the caller to hold actions:
# write, and legacy callers (old dispatchers) lack it — see #163 infra regression.
# The dedupe lives in the per-repo DISPATCHERS, which declare actions: write.
permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: validate
    runs-on: ${{ vars.REVIEW_RUNNER_LABEL || 'ubuntu-latest' }}
    # FAIL-HARD wall clock (opencharly/opencharly#199 RCA, 2026-09-12): without
    # this, a provider-unanswered review burns the full plugin-review attempt
    # budget with zero interim output before classifying INCONCLUSIVE — and the
    # GitHub default of 360 would let a doomed run occupy a runner for 6 hours.
    # Observed REVIEWS conclude in 38s-13m19s (the 13m19s run failed — even the
    # slowest observed review, failure included, fits inside 20 with margin).
    # The single 43m54s run (34688719317) was the provider-unanswered burn this
    # cap exists to kill, classified INCONCLUSIVE, not a review. GitHub cancels
    # the job at the cap; the required check
    # goes RED fast instead of hanging pending, and the gate is re-run
    # explicitly (gh workflow run pr-validator.yml -f pr-number=<N>), never
    # retried in-job (R4).
    timeout-minutes: 20
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      - uses: actions/checkout@v7
        with:
          repository: opencharly/action-review
          ref: main
          path: runner-config
          fetch-depth: 1

      - name: "Ensure charly (action-review config repo; self-hosted image: no-op)"
        id: ensure-charly
        env:
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION || '' }}
        run: |
          if command -v charly >/dev/null 2>&1; then
            echo "charly present: $(charly version)"; exit 0
          fi
          # PINNED charly release - the gate is deterministic; bump here per release
          # (vars.CHARLY_VERSION overrides). No runtime latest-resolution: the
          # releases/latest redirect is abuse-limited on shared runner IPs (curl exit 22).
          # v2026.254.1902 is the first release whose plugin bundle carries
          # plugin-review's timeout-class taxonomy + the INCONCLUSIVE terminal
          # marker the Gate (inconclusive) step consumes. VERIFIED against the
          # published asset, never asserted — strings of the bundled plugin-review
          # extracted from charly-plugins-linux-amd64.tar.gz; the exact commands
          # and their full output are in this PR's body, section
          # "How tested — the pin's strings evidence" (pasted verbatim):
          #   v2026.254.1902: "inconclusive: all %d attempts timed out " -> 1 hit
          #                   "AI_REVIEW_ATTEMPT_TIMEOUT"                -> 1 hit
          #                   "NOT a review verdict"                    -> 1 hit
          #   v2026.251.1947: all three of the above                   -> 0 hits
          TAG="${CHARLY_VERSION:-v2026.254.1902}"
          # PER-RUN dir (runner.temp, wiped between jobs): on self-hosted runners
          # $HOME persists across jobs and a stale plugin binary there crashes
          # the gate (live evidence: plugin-review parseReviewArgs panic, exit 2,
          # while the same tag+tar runs green in a clean dir).
          D="${{ runner.temp }}/charly-$TAG"; mkdir -p "$D/bin" "$D/plugins"
          # release assets are public — tokenless curl (gh/GITHUB_TOKEN injection
          # is unreliable in workflow_call step envs: live smoke exit-4 evidence).
          curl -fsSL -o "$D/charly-linux-amd64" "https://github.com/opencharly/charly/releases/download/$TAG/charly-linux-amd64"
          curl -fsSL -o "$D/charly-plugins-linux-amd64.tar.gz" "https://github.com/opencharly/charly/releases/download/$TAG/charly-plugins-linux-amd64.tar.gz"
          mv "$D/charly-linux-amd64" "$D/bin/charly" && chmod +x "$D/bin/charly"
          tar -xzf "$D/charly-plugins-linux-amd64.tar.gz" -C "$D/plugins"
          echo "$D/bin" >> "$GITHUB_PATH"
          echo "CHARLY_PLUGIN_DIR=$D/plugins" >> "$GITHUB_ENV"
          # The self-test is a sanity probe, NEVER a hard gate: on self-hosted
          # runners the released plugin-review can panic with a nil-deref in
          # args parsing (live evidence: exit-2 crash with 13 plugin args on the
          # runner while the SAME binary passes a clean ubuntu run). The review
          # step itself re-validates the plugin at use — a bootstrap probe crash
          # must not take the whole org gate down.
          CHARLY_PLUGIN_DIR="$D/plugins" "$D/bin/charly" review --self-test || echo "::warning::bootstrap self-test crashed — continuing (the review step re-validates)"

      - name: Run review plan (steps + runtime plugins declared in action-review review-plan.yml)
        id: review
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          AI_REVIEW_PROVIDER: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL:     ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL:  ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MAX_TURNS: ${{ vars.AI_REVIEW_MAX_TURNS || '20' }}
          AI_REVIEW_ATTEMPT_TIMEOUT: ${{ vars.AI_REVIEW_ATTEMPT_TIMEOUT || '300' }}
          # Zero retries (opencharly/plugin-review#5, engine PR #6): a failed
          # first attempt is terminal — no repeat cycle. INERT until the engine
          # release carrying the knob is welded and TAG below is bumped; the
          # pinned bundle ignores unknown env. Default 1 org-wide; any repo may
          # opt back to retries via its own AI_REVIEW_MAX_ATTEMPTS var.
          AI_REVIEW_MAX_ATTEMPTS: ${{ vars.AI_REVIEW_MAX_ATTEMPTS || '1' }}
          AI_REVIEW_API_KEY:   ${{ secrets.AI_REVIEW_API_KEY }}
          REVIEW_PROMPT_PATH:  ${{ github.workspace }}/runner-config/prompt/validator.md
          REVIEW_PLAN_PATH:    ${{ github.workspace }}/runner-config/review-plan.yml
          GITHUB_TOKEN:        ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/runner-config"

          # /tmp/review.txt is written ONLY by a fully successful plan
          # (plugin-review plan.go writes OutPath on the success path, after every
          # verdict:required step produced a verdict) — so clear it first: a stale
          # file must never be parsed as THIS run's verdict.
          rm -f /tmp/review.txt /tmp/review.log

          # bash -e must NOT abort here: a verdict-less run is a CLASS to report,
          # not a crash. Capture the exit code instead (plugin-review exits 1 on
          # the provider-unanswered class, 2 on "verdict: required but no Verdict
          # line produced"). NO RETRY: see the RCA header — a retry re-runs the
          # same doomed generation (R4).
          rc=0
          charly review --plan "$REVIEW_PLAN_PATH" --out /tmp/review.txt > /tmp/review.log 2>&1 || rc=$?
          echo "review rc=$rc"
          cat /tmp/review.log

          # The plugin names the class explicitly (the INCONCLUSIVE terminal marker
          # carried by the pinned release).
          provider_unanswered=false
          if grep -qiE 'inconclusive:|provider unanswered|Client[.]Timeout exceeded|context deadline exceeded' /tmp/review.log; then
            provider_unanswered=true
          fi

          verdict=""
          if [ -f /tmp/review.txt ]; then
            verdict=$(grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$' /tmp/review.txt | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u || true)
          fi

          # FAIL-CLOSED on the review exit code (T3/T4): capturing rc must
          # never mean WEAKER than the bash -e it replaced. rc != 0 means the
          # plan did not complete cleanly, so the ONLY class such a run may
          # carry is BLOCK (a real finding, written before the failure). Any
          # other verdict a non-zero run wrote is UNTRUSTWORTHY: a crashed or
          # stalled reviewer must never arm auto-merge on a stray PASS line.
          # That file is moved ASIDE, so Parse verdict finds no verdict and
          # classifies INCONCLUSIVE (exit 3, check RED) — the previous
          # revision let it pass.
          discarded=false
          if [ -n "$verdict" ] && [ "$rc" -ne 0 ] &&
             [ "$verdict" != "BLOCK" ]; then
            discarded=true
            untrusted=$(printf '%s' "$verdict" | tr '\n' '+')
            echo "::warning::review rc=$rc wrote $untrusted — FAIL-CLOSED"
            echo "  discarded: a non-zero review exit may only carry BLOCK"
            mv /tmp/review.txt /tmp/review.untrusted.txt
            verdict=""
          fi

          # The review TEXT is markdown and its step sections are ###-led lines
          # (e.g. "### [step: review]"): GitHub's $GITHUB_OUTPUT heredoc parser
          # rejects such lines with 'Invalid format' (live distro-omarchy#49
          # evidence) — so the text is NEVER routed through GITHUB_OUTPUT.
          # Same-job consumers (Parse verdict / Gates) read /tmp/review.txt.
          # braced group: shellcheck SC2129 (individual appends to one file).
          # engine-defective (opencharly/.github#97): the engine COMPLETED a first turn
          # (the endpoint answered) and failed a LATER turn / produced empty content —
          # the context-dependent class a provider-egress story cannot explain. Naming
          # it keeps a defective engine from being reported as a generic
          # provider-unanswered run (and points at the T13 exception above).
          engine_defective=false
          if [ "$provider_unanswered" = "true" ] &&
             grep -qE 'turn 1: [0-9]+ tool call' /tmp/review.log; then
            engine_defective=true
          fi

          # Provider HTTP rejection (the class a 4xx/5xx actually belongs to): the review
          # client logs `LLM <status>: <body>` when the ENDPOINT parsed the request and
          # REFUSED it — e.g. opencode Go answering 400 MissingSessionID. That is a
          # provider/protocol/configuration matter, NOT the engine streaming class, and the
          # notice below must not assert the streaming story for it (observed 2026-09-12:
          # every org run was reported under a narrative that blamed an already-fixed engine
          # defect while the log carried an explicit HTTP 400).
          provider_error=""
          # [45][0-9][0-9] — 4xx/5xx ONLY. A broader pattern (1xx-5xx) reports a non-refusal
          # status line as a confident provider REJECTION and, because this branch is checked
          # FIRST, preempts the engine-defective class — the same misattribution this notice
          # exists to remove, inverted. The `non-error-status` scenario pins that boundary.
          if pe=$(grep -m1 -oE 'LLM [45][0-9][0-9]' /tmp/review.log); then
            provider_error="${pe#LLM }"
          fi
          {
            echo "review_rc=$rc"
            echo "provider_unanswered=$provider_unanswered"
            echo "engine_defective=$engine_defective"
            echo "provider_error=$provider_error"
            echo "discarded_verdict=$discarded"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$verdict" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            # ONLY the first line: a multi-line value would break the GITHUB_OUTPUT
            # 'name=value' format. Mixed PASS+BLOCK is classified by Parse verdict.
            first=$(printf '%s\n' "$verdict" | sed -n '1p')
            echo "verdict=$first" >> "$GITHUB_OUTPUT"
            echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::review rc=$rc exited without a BLOCK verdict"
              echo "  INCONCLUSIVE — no BLOCK, no pass; the check stays RED"
            else
              echo "::warning::review rc=0 produced no Verdict line"
              echo "  INCONCLUSIVE — no BLOCK, no pass; the check stays RED"
            fi
          fi

      # Second fail-closed layer (T3/T4): even if a verdict survived in
      # review.txt, a non-zero review exit may only yield BLOCK — anything else
      # this step finds is classified INCONCLUSIVE, never PASS.
      - name: Parse verdict
        id: parse
        env:
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
        run: |
          found=""
          if [ -f /tmp/review.txt ]; then
            found=$(grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$' /tmp/review.txt || true)
          fi
          n=0
          if [ -n "$found" ]; then
            n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          fi
          if [ "$n" -eq 0 ]; then
            # NO Verdict line — never exit 2 blindly here: the two classes behind
            # this (provider unanswered / verdict-less review output) are NOT code
            # findings. Classify INCONCLUSIVE; the Gate (inconclusive) step reports
            # it honestly on the PR and keeps the required check RED.
            echo "verdict=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            echo "::warning::no Verdict line in the review output (provider_unanswered=${{ steps.review.outputs.provider_unanswered }}, review_rc=${{ steps.review.outputs.review_rc }}) — INCONCLUSIVE"
            exit 0
          fi
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          # FAIL-CLOSED (T3/T4): a non-zero review exit may only carry a real
          # BLOCK finding. A PASS — or a mixed PASS+BLOCK — read from a file an
          # rc != 0 run wrote is not a trustworthy pass — INCONCLUSIVE, the
          # check stays RED.
          if [ "${REVIEW_RC:-0}" != "0" ] && [ "$distinct" != "BLOCK" ]; then
            echo "verdict=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            echo "::warning::review rc=${REVIEW_RC}, verdict not BLOCK"
            echo "  FAIL-CLOSED: a non-zero review exit may only carry BLOCK"
            exit 0
          fi
          count=$(printf '%s\n' "$distinct" | wc -l | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            # Mixed PASS+BLOCK: a multi-line value would break the GITHUB_OUTPUT
            # 'name=value' format, so the CLASS is the output.
            echo "verdict=AMBIGUOUS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate (BLOCK)
        if: steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1

      # INCONCLUSIVE is NOT a BLOCK: no code finding was produced — the provider
      # never answered (or the review yielded no Verdict line). Report that plainly
      # on the PR and keep the required check RED: unreviewed code must never
      # merge, and turning this into a pass would silently defeat the gate.
      - name: Gate (inconclusive)
        if: steps.parse.outputs.verdict == 'INCONCLUSIVE'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
          PROVIDER_UNANSWERED: ${{ steps.review.outputs.provider_unanswered }}
          PROVIDER_ERROR: ${{ steps.review.outputs.provider_error }}
          ENGINE_DEFECTIVE: ${{ steps.review.outputs.engine_defective }}
          DISCARDED_VERDICT: ${{ steps.review.outputs.discarded_verdict }}
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
        run: |
          class="verdict-less review output"
          # The root-cause narrative is CLASS-AWARE. Printing ONE fixed cause for every class
          # is how a provider HTTP rejection came to be reported under the engine streaming
          # story (2026-09-12, every org run): the class and its narrative must agree, so each
          # branch names the cause ITS OWN evidence supports.
          rootcause='**Root cause.** A NON-STREAMING request under a WHOLE-GENERATION deadline: plugin-review POSTs with no `stream:true` (candy/plugin-review/llm.go:92), so response headers arrive only when the ENTIRE generation finishes, all under one `http.Client{Timeout}` (llm.go:80) whose built-in default is 5 minutes (review.go:28). The review runs in a 20-turn tool loop that APPENDS the tool results of every turn (the PR diff/files) to the context and retries the whole loop up to AI_REVIEW_MAX_ATTEMPTS times (3 in the pinned bundle; 1 once the fail-fast wiring activates): turn 1 completes, and turn 2 — carrying the enlarged context — fails in ONE OF TWO OBSERVED ways: it returns EMPTY content (`turn 2: final content len=0`, observed on 2 of the 3 attempts in run 34682776608) or it exceeds the 5-minute cap (observed on the third). Both are one defect class — an unbounded, non-streaming request whose context grew. The endpoint answered 405 in 0.18s in the same window — there is no throttled egress.'
          remedy1='1. this workflow now PASSES the cap through — `AI_REVIEW_ATTEMPT_TIMEOUT` (org-settable, 300s default) — raise it if a large context still exceeds it;'
          remedy2='2. plugin-review: stream the completion, set an explicit `http.Transport`, bound the tool-result payloads, and retry the FAILED TURN rather than the whole loop (owner: plugin-review).'
          if [ -n "$PROVIDER_ERROR" ]; then
            class="provider rejected the request (HTTP ${PROVIDER_ERROR}) — a provider/protocol/config matter, not an engine verdict"
            rootcause="**Root cause.** The model endpoint answered **HTTP ${PROVIDER_ERROR}** — an explicit REJECTION, not a stall: the provider parsed the request and refused it, and its own message is in the diagnostics below. A 4xx/5xx here is a provider, protocol or configuration matter: the engine never got to run a turn, so the streaming and no-headers classes do NOT apply."
            remedy1="1. read the provider message in the diagnostics below — it names the missing or wrong element;"
            remedy2="2. fix it at the review client or in the org AI_REVIEW_* variables, then re-run. An HTTP rejection is deterministic — do NOT retry blindly (R4)."
          elif [ "$ENGINE_DEFECTIVE" = "true" ]; then
            class="engine-defective (the review engine completed turn 1 and failed a later turn — the context-dependent timeout/empty-content class; opencharly/.github#97, see the T13 engine-change exception)"
          elif [ "$PROVIDER_UNANSWERED" = "true" ]; then
            class="provider unanswered (the provider returned no response headers within the attempt timeout)"
          elif [ "$DISCARDED_VERDICT" = "true" ]; then
            class="charly review exited rc=${REVIEW_RC} with a non-BLOCK"
            class="$class verdict — FAIL-CLOSED: a non-zero review exit may"
            class="$class only carry a real BLOCK finding, discarded"
          fi
          {
            echo '## validator INCONCLUSIVE — no review verdict was produced (not a BLOCK; no code finding)'
            echo
            echo 'The gate could **not** obtain a review verdict on this run, so it produced **no code finding**. This is **not a BLOCK** and the PR is **not** being rejected — but the required check stays **RED on purpose**: unreviewed code must never merge.'
            echo
            echo "- class: $class"
            echo "- review exit code: ${REVIEW_RC:-n/a}"
            echo "- in-job retries: none — the gate REPORTS the class instead of papering over it (R4)"
            echo
            echo "$rootcause"
            echo
            echo '**Durable remedy.**'
            echo "$remedy1"
            echo "$remedy2"
            echo
            echo 'A run that produced no verdict keeps this required check **RED**: unreviewed code must never merge.'
            echo
            echo '<details><summary>Diagnostics (tail of the review log)</summary>'
            echo
            echo '~~~'
            tail -n 25 /tmp/review.log 2>/dev/null || echo '(no review log captured)'
            echo '~~~'
            echo
            echo '</details>'
          } > /tmp/inconclusive-comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/inconclusive-comment.md || echo "::warning::could not post the INCONCLUSIVE comment (non-fatal)"
          echo "::error::validator INCONCLUSIVE — no review verdict was produced (not a BLOCK; no code finding) — see the PR comment"
          exit 3

      - name: Gate (ambiguous)
        if: steps.parse.outputs.verdict != 'PASS' && steps.parse.outputs.verdict != 'BLOCK' && steps.parse.outputs.verdict != 'INCONCLUSIVE'
        run: |
          echo "::error::Ambiguous verdict from AI review (mixed PASS+BLOCK, or an unparsable verdict output)"
          exit 2

      # Enable auto-merge — RESILIENTLY. GitHub rejects the mutation with
      # "Pull request is in unstable status" while any required check is still
      # pending/failing, and repos may legitimately carry more than one check
      # besides this one (e.g. a candy CI gate). The REVIEW verdict is already
      # PASS at this point, so arming logistics must never turn the required
      # check red: retry through transient settling states, attempt the
      # update-branch merge when the branch is behind, and soft-skip (warning)
      # when the repository setting does not allow auto-merge.
      - name: Enable auto-merge
        if: steps.parse.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            # The job shell runs with -e: a bare failing $( ) assignment would
            # kill the script before the retry loop runs. Capture in a
            # condition context (errexit-immune) instead.
            rc=0
            out=$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" 2>&1) || rc=$?
            echo "attempt $attempt rc=$rc: $out"
            if [ $rc -eq 0 ]; then
              echo "Auto-merge armed"
              exit 0
            fi
            case "$out" in
              *"unstable status"*)
                echo "attempt $att"
                sleep 10
                ;;
              *"is behind"*)
                echo "branch behind — syncing"
                gh pr update-branch "$PR_NUMBER" --repo "$REPO" 2>/dev/null || true
                sleep 15
                ;;
              *"auto-merge is not allowed"*)
                echo "::warning::auto-merge not allowed for this repository — verdict is PASS, merge manually"
                exit 0
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::warning::auto-merge arming did not settle — verdict is PASS, merge manually"

      # ---------------------------------------------------------------------------
      # FAILURE EVIDENCE (always). The INCONCLUSIVE notice carries only the last 25
      # lines of the review log, and a run log is transient — so a failure deep in a
      # long review (turn 7 of a 20-turn loop; a provider rejection mid-plan) is only
      # findable by scrolling an expiring log. This step preserves the FULL evidence as
      # a downloadable artifact AND puts the class + the effective configuration on the
      # run own Summary page, so a reader never has to guess WHICH log to open — the gap
      # that made the 2026-09-12 org-wide outage (an HTTP 400 the model endpoint named
      # explicitly) take longer to diagnose than the evidence warranted.
      # ---------------------------------------------------------------------------
      - name: Evidence bundle (always)
        id: evidence
        if: always()
        # A REPORTING path must never change the verdict: without this, a failure inside the
        # evidence step would fail the job and turn a PASS run RED. The workflow contract is
        # explicit — a run that produced a verdict keeps its required check green.
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          REVIEW_RC: ${{ steps.review.outputs.review_rc }}
          PROVIDER_ERROR: ${{ steps.review.outputs.provider_error }}
          PROVIDER_UNANSWERED: ${{ steps.review.outputs.provider_unanswered }}
          ENGINE_DEFECTIVE: ${{ steps.review.outputs.engine_defective }}
          DISCARDED_VERDICT: ${{ steps.review.outputs.discarded_verdict }}
          CHARLY_VERSION: ${{ vars.CHARLY_VERSION }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          ATTEMPT_TIMEOUT: ${{ vars.AI_REVIEW_ATTEMPT_TIMEOUT }}
        run: |
          D="${RUNNER_TEMP}/validator-evidence"
          mkdir -p "$D"
          # The manifest is the machine-readable answer to "what happened": the class
          # inputs, the exit code, the provider/model/base_url ACTUALLY in force, and the
          # file inventory. Written even when a log is missing — an absent file is itself
          # evidence (a 3-line review log means the review never started; 500 lines mean it
          # ran and failed partway).
          {
            echo "repo=${REPO}"
            echo "pr=${PR_NUMBER}"
            echo "review_rc=${REVIEW_RC:-}"
            echo "provider_error=${PROVIDER_ERROR:-}"
            echo "provider_unanswered=${PROVIDER_UNANSWERED:-}"
            echo "engine_defective=${ENGINE_DEFECTIVE:-}"
            echo "discarded_verdict=${DISCARDED_VERDICT:-}"
            echo "vars_charly_version=${CHARLY_VERSION:-<unset>}"
            echo "vars_ai_review_provider=${AI_REVIEW_PROVIDER:-<unset>}"
            echo "vars_ai_review_model=${AI_REVIEW_MODEL:-<unset>}"
            echo "vars_ai_review_base_url=${AI_REVIEW_BASE_URL:-<unset>}"
            echo "vars_ai_review_attempt_timeout=${ATTEMPT_TIMEOUT:-<unset>}"
          } > "$D/manifest.txt"
          for f in /tmp/review.log /tmp/review.txt /tmp/review.untrusted.txt; do
            b=$(basename "$f")
            if [ -f "$f" ]; then cp "$f" "$D/$b"; else echo "(absent)" > "$D/$b.absent"; fi
          done
          wc -l /tmp/review.log 2>/dev/null > "$D/review.log.lines" || echo "0" > "$D/review.log.lines"
          echo "evidence dir:"; ls -la "$D"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## Validator evidence"
              echo
              echo "| field | value |"
              echo "|---|---|"
              # Backticks are markdown code spans here, NOT command substitution: inside a
              # double-quoted echo they must be ESCAPED, or bash tries to run the markdown
              # as commands (the offline harness caught exactly that: "line 34: 0: command
              # not found"). Single quotes cannot be used because these lines expand ${VAR}.
              echo "| review exit code | \`${REVIEW_RC:-n/a}\` |"
              echo "| provider HTTP error | \`${PROVIDER_ERROR:-none}\` |"
              echo "| class inputs | provider_unanswered=\`${PROVIDER_UNANSWERED:-}\` engine_defective=\`${ENGINE_DEFECTIVE:-}\` discarded=\`${DISCARDED_VERDICT:-}\` |"
              echo "| provider / model / base_url | \`${AI_REVIEW_PROVIDER:-<unset>}\` / \`${AI_REVIEW_MODEL:-<unset>}\` / \`${AI_REVIEW_BASE_URL:-<unset>}\` |"
              echo "| attempt-cap var | \`${ATTEMPT_TIMEOUT:-<unset>}\` |"
              echo
              echo "**Evidence:** the artifact named \`validator-evidence\` holds the FULL review log and the verdict files; the PR comment carries the class and the last 25 log lines."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        # Same reason as the bundle above: an artifact-service hiccup must not fail a PASS run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validator-evidence
          path: ${{ runner.temp }}/validator-evidence
          if-no-files-found: ignore
          retention-days: 14
