# PR validator — AI-powered review gate for the opencharly org.
#
# Runs the org-wide `opencharly/pi-review-action` as a fresh, independent
# validator on every pull request. Posts a single PR comment and sets the
# `charly/pr-validator` check from the deterministic `Verdict: PASS|BLOCK`.
#
# Fully generic — nothing is hardcoded. Provider, model, and endpoint come
# from org-level variables; the API key comes from the org-level secret.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-validator:
    name: charly/pr-validator
    runs-on: ubuntu-latest
    steps:
      - uses: opencharly/pi-review-action@v1.0.7
        id: review
        continue-on-error: true
        with:
          provider: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          model: ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          base_url: ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20

      - name: Parse verdict
        id: parse
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          if [ -z "$REVIEW" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          if [ "$n" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Retry if empty (attempt 1/3)
        if: steps.parse.outputs.empty == 'true'
        uses: opencharly/pi-review-action@v1.0.7
        id: review2
        continue-on-error: true
        with:
          provider: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          model: ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          base_url: ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20

      - name: Parse verdict (attempt 2)
        if: steps.parse.outputs.empty == 'true'
        id: parse2
        env:
          REVIEW: ${{ steps.review2.outputs.response }}
        run: |
          if [ -z "$REVIEW" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          if [ "$n" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Retry if empty (attempt 2/3)
        if: steps.parse2.outputs.empty == 'true'
        uses: opencharly/pi-review-action@v1.0.7
        id: review3
        continue-on-error: true
        with:
          provider: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          model: ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          base_url: ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20

      - name: Parse verdict (attempt 3)
        if: steps.parse2.outputs.empty == 'true'
        id: parse3
        env:
          REVIEW: ${{ steps.review3.outputs.response }}
        run: |
          if [ -z "$REVIEW" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          if [ "$n" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "verdict=RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate verdict
        if: always()
        env:
          VERDICT: ${{ steps.parse.outputs.verdict || steps.parse2.outputs.verdict || steps.parse3.outputs.verdict }}
        run: |
          case "$VERDICT" in
            PASS) echo "AI review passed"; exit 0 ;;
            BLOCK) echo "::error::AI review blocked this PR"; exit 1 ;;
            RETRY) echo "::error::All 3 review attempts returned empty responses"; exit 2 ;;
            *) echo "::error::Invalid verdict: $VERDICT"; exit 2 ;;
          esac