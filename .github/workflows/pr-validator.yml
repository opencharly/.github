# ORG-WIDE PR VALIDATOR (reusable, called via @main)
#
# Runs on every PR event (pull_request) and on workflow_dispatch.
#   1. If the CHANGELOG placeholder is not finalized: rename it, push,
#      then dispatch a validation run on the PR branch (workflow_dispatch
#      always runs, no approval needed), and EXIT.
#   2. Otherwise (CHANGELOG finalized): AI review ONCE. On PASS, enable
#      native auto-merge.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: parseInt('${{ inputs.pr-number }}'),
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # 1. Rename CHANGELOG first (before validation)
      - name: Rename CHANGELOG
        id: changelog
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          p=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" -- CHANGELOG/ \
            | awk '$1=="A"{print $NF}' \
            | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
          [ -z "$p" ] && exit 0
          c=$(git show "origin/$HEAD_REF:$p" 2>/dev/null || true)
          echo "$c" | grep -q "auto-merge-finalized: $(basename "$p" .md)" && exit 0
          stamp=$(date -u +%Y.%j.%H%M)
          [ "$(basename "$p" .md)" = "$stamp" ] && exit 0
          git checkout -q -B dev/auto-merge "origin/$HEAD_REF"
          git mv "$p" "CHANGELOG/$stamp.md"
          sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md"
          git add "CHANGELOG/$stamp.md"
          git -c user.name='opencharly auto-merge' -c user.email='actions@github.com' \
            commit -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)"
          git push origin "HEAD:${HEAD_REF}"
          echo "renamed=true" >> "$GITHUB_OUTPUT"

      # If renamed: dispatch validation on the PR branch and exit.
      # The dispatch always works (workflow_dispatch) and creates a
      # check on the PR head (the PR branch head).
      - name: Dispatch validation on PR branch
        if: steps.changelog.outputs.renamed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pr-validator-dispatcher.yml',
              ref: '${{ steps.pr.outputs.head_ref }}',
              inputs: { 'pr-number': '${{ inputs.pr-number }}' },
            });
            core.info('Validation dispatched on PR branch');

      - name: Exit after rename
        if: steps.changelog.outputs.renamed == 'true'
        run: echo "Renamed — validation dispatched"

      # 2. AI review (only when not renamed in this run)
      - uses: opencharly/pi-review-action@v1.0.9
        if: steps.changelog.outputs.renamed != 'true'
        id: review
        with:
          provider: ${{ vars.AI_REVIEW_PROVIDER }}
          model: ${{ vars.AI_REVIEW_MODEL }}
          base_url: ${{ vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20
          pr_number: ${{ inputs.pr-number }}

      - name: Parse verdict
        if: steps.changelog.outputs.renamed != 'true'
        id: parse
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          [ "$n" -eq 0 ] && { echo "::error::No verdict in response"; exit 2; }
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate (BLOCK)
        if: steps.changelog.outputs.renamed != 'true' && steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1

      # 3. Enable native auto-merge — GitHub waits for all checks
      - name: Enable auto-merge
        if: steps.changelog.outputs.renamed != 'true' && steps.parse.outputs.verdict == 'PASS'
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, mergeMethod: SQUASH
                }) { pullRequest { id } }
              }
            `, { id: '${{ steps.pr.outputs.node_id }}' });
            core.info('Auto-merge enabled');
