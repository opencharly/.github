# ORG-WIDE PR VALIDATOR (reusable via workflow_call)
#
# Flow:
#   1. If the PR has a CHANGELOG placeholder not yet finalized:
#      rename it to the current CalVer, push, and EXIT (the push
#      triggers a new run that validates).
#   2. If the CHANGELOG is already finalized (or absent):
#      run the AI review ONCE, then enable native auto-merge on PASS.
name: charly/pr-validator

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      ai_review_provider:
        type: string
        required: false
      ai_review_model:
        type: string
        required: false
      ai_review_base_url:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ inputs.pr-number }}');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('node_id', pr.node_id);
            core.info(`PR #${pr.number} head=${pr.head.sha.slice(0,12)} ref=${pr.head.ref}`);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Rename CHANGELOG placeholder (if not finalized)
        id: changelog
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          p=$(git diff --name-status "origin/${BASE_REF}...origin/${HEAD_REF}" -- CHANGELOG/ \
            | awk '$1=="A"{print $NF}' \
            | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
          echo "placeholder=$p"
          [ -z "$p" ] && exit 0

          c=$(git show "origin/$HEAD_REF:$p" 2>/dev/null || true)
          echo "$c" | grep -q "auto-merge-finalized: $(basename "$p" .md)" \
            && { echo "already-finalized" && exit 0; }

          stamp=$(date -u +%Y.%j.%H%M)
          [ "$(basename "$p" .md)" = "$stamp" ] \
            && { echo "already-at-stamp" && exit 0; }

          echo "Renaming $p -> CHANGELOG/$stamp.md"
          git checkout -q -B dev/auto-merge "origin/$HEAD_REF"
          git mv "$p" "CHANGELOG/$stamp.md"
          sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md"
          git add "CHANGELOG/$stamp.md"
          git -c user.name='opencharly auto-merge' -c user.email='actions@github.com' \
            commit -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)"
          git push origin "HEAD:${HEAD_REF}"
          echo "result=renamed-and-pushed" >> "$GITHUB_OUTPUT"

      - uses: opencharly/pi-review-action@v1.0.9
        if: steps.changelog.outputs.result != 'renamed-and-pushed'
        id: review
        with:
          provider: ${{ inputs.ai_review_provider || vars.AI_REVIEW_PROVIDER }}
          model: ${{ inputs.ai_review_model || vars.AI_REVIEW_MODEL }}
          base_url: ${{ inputs.ai_review_base_url || vars.AI_REVIEW_BASE_URL }}
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          max_turns: 20
          pr_number: ${{ inputs.pr-number }}

      - name: Parse verdict
        if: steps.changelog.outputs.result != 'renamed-and-pushed'
        id: parse
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          found=$(printf '%s\n' "$REVIEW" | grep -E '^Verdict: (BLOCK|PASS)[[:space:]]*$')
          n=$(printf '%s\n' "$found" | grep -cE '^Verdict:')
          [ "$n" -eq 0 ] && { echo "::error::No verdict in response"; exit 2; }
          distinct=$(printf '%s\n' "$found" | sed -E 's/^Verdict: (BLOCK|PASS).*/\1/' | sort -u)
          echo "verdict=$distinct" >> "$GITHUB_OUTPUT"

      - name: Gate verdict (BLOCK)
        if: steps.changelog.outputs.result != 'renamed-and-pushed' && steps.parse.outputs.verdict == 'BLOCK'
        run: |
          echo "::error::AI review blocked this PR"
          exit 1

      - name: Gate verdict (ambiguous)
        if: >
          steps.changelog.outputs.result != 'renamed-and-pushed' &&
          steps.parse.outputs.verdict != 'BLOCK' &&
          steps.parse.outputs.verdict != 'PASS'
        run: |
          echo "::error::Ambiguous verdict: ${{ steps.parse.outputs.verdict }}"
          exit 2

      - name: Enable native auto-merge
        if: steps.changelog.outputs.result != 'renamed-and-pushed' && steps.parse.outputs.verdict == 'PASS'
        uses: actions/github-script@v7
        with:
          script: |
            const num = parseInt('${{ steps.pr.outputs.number }}');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: num });
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id, mergeMethod: SQUASH
                }) { pullRequest { id } }
              }
            `, { id: pr.node_id });
            core.info('Auto-merge enabled — GitHub will merge when all checks pass');
