# DETECT PRs THAT CAN NEVER LAND, SILENTLY (opencharly/.github#175, #186).
#
# The subject is not "a PR that is blocked" — a red PR gets read — but a PR that is blocked while
# reading as "queued". THREE shapes, each measured:
#
#   1. ARMED + BEHIND (#175). Native auto-merge armed + the org ruleset's
#      required_status_checks.strict = true + a head behind a moved base: auto-merge does not update
#      the head branch, a BEHIND head cannot merge, and NOTHING goes red. Measured 2026-10-07T22:43 →
#      2026-10-08T09:09 on this host, ~10 h with ZERO landings while at least seven PRs sat green or
#      armed (sdk#356, plugin-check#89, plugin-clean#12, plugin-deploy-pod#30, plugin-fleet#32, …).
#      The blast radius is every PR whose base moves after its head is pushed — every producer→consumer
#      pin sequence this org lands all day.
#
#   2. ARMED + DIRTY (#175 comment 6084457430). Strictly worse: `gh pr update-branch` CANNOT resolve a
#      conflict, so an armed conflicted PR waits forever with no signal at all (charly#432, ~30 h).
#
#   3. THE REQUIRED CHECK NEVER RESOLVED (#186). A superseded validator run leaves
#      `validate / validate` CANCELLED; arming happens INSIDE the run that was cancelled, so the PR
#      sits BLOCKED with autoMergeRequest == null and reads as "queued". Measured on this repo's own
#      #185 (armed = Y *and* the required check CANCELLED) and on charly#871 (a re-run replaced a PASS
#      with a BLOCK carrying a finding the first run had not raised — so re-dispatching RE-OPENS the
#      verdict and must never be done against a head nobody has read and fixed).
#
# WHY IT IS A WORKFLOW: the fields that decide all three shapes are one org-wide GraphQL read away,
# and nothing in this repo read them. A scheduled run is the alarm — a red run is visible in the
# Actions tab — whereas a per-repo hook would have to be installed in ~400 repos to say the same
# thing once. `scripts/check-stalled-automerge.sh` carries the rule, its self-test, and its scope
# limit (an UNARMED behind/DIRTY head, and a head carrying no run of the required context at all —
# the fork case, #179 — are deliberately not selected).
#
# REQUIRED APP PERMISSION: `pull_requests: read` (org-wide). The `charly-auto-merge` App already
# carries the pull-request authority the landing chain needs, so no new grant is introduced.
#
# THE ALARM IS A RED RUN, deliberately: exit 1 when anything is stalled, exit 0 when nothing is,
# and exit 2 when the query itself failed — a detector that reports "nothing stalled" from a
# failed read is worse than no detector, so the script refuses to.

name: stalled auto-merge detector

on:
  schedule:
    # Every 30 minutes. The measured stall ran ~10 h unnoticed; half an hour bounds that to one
    # landing cycle without polling anything hard enough to be rate-limited.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Create bot token (charly-auto-merge App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, node24
        with:
          app-id: ${{ secrets.CHARLY_AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.CHARLY_AUTO_MERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24

      # The filter must be able to FAIL before it is trusted to pass: a detector whose selection
      # rule returns nothing is a green no-op that proves nothing.
      - name: Self-test the selection rule
        run: bash scripts/check-stalled-automerge.sh --self-test

      # The three shapes this alarm reads: ARMED + BEHIND, ARMED + DIRTY, and THE REQUIRED CHECK
      # NEVER RESOLVED (#186). The self-test drives one fixture per class AND the POISON pair — an
      # older cancelled run beside a newer success, which keeps a PR blocked forever — because a
      # filter that reads only the newest run would miss it.
      - name: Detect silently stalled PRs org-wide (BEHIND / DIRTY / non-resolving required check)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash scripts/check-stalled-automerge.sh
