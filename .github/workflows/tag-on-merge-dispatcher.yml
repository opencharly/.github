# ORG-WIDE TAG-ON-MERGE DISPATCHER — .github repo's own instance.
#
# Every squash-merge pushes a commit to main; tag it with the
# merge-time CalVer. (pull_request:closed never fires for auto-merges —
# this GitHub emits action "merged", which is not a valid trigger.)
name: tag-on-merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    uses: ./.github/workflows/tag-on-merge.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
