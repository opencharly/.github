# ORG-WIDE TAG-ON-MERGE DISPATCHER — .github repo's own instance.
#
# Runs the sweep after every validator completion; the schedule is a
# redundant fallback. workflow_run is the only event that fires after
# a bot auto-merge (pull_request:closed never fires; GITHUB_TOKEN
# pushes create no runs).
name: tag-on-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  tag:
    if: >
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/tag-on-merge.yml
    secrets: inherit
