# ORG-WIDE TAG-ON-MERGE DISPATCHER — .github repo's own instance.
#
# Event-driven (workflow_run on the validator) + a scheduled sweep that
# closes the race where the event fires before the merge commits.
name: tag-on-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  tag:
    if: >
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/tag-on-merge.yml
    with:
      head-sha: ${{ github.event.workflow_run.head_sha || '' }}
      sweep: ${{ github.event_name == 'schedule' }}
    secrets: inherit
