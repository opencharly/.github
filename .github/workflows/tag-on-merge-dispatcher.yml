# ORG-WIDE TAG-ON-MERGE DISPATCHER — .github repo's own instance.
#
# workflow_run fires on every validator completion (unlike
# pull_request:closed, which never fires for auto-merges). The reusable
# finds the PR by the run's head sha and tags the merge commit.
name: tag-on-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/tag-on-merge.yml
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
