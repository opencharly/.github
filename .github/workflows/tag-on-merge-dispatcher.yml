# ORG-WIDE TAG-ON-MERGE DISPATCHER — .github repo's own instance.
name: tag-on-merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/tag-on-merge.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
