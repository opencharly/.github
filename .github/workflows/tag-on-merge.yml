# ORG-WIDE TAG-ON-MERGE (reusable via workflow_call)
#
# Event-driven mode: called on workflow_run after each validator
# completion; tags the PR's merge commit if already merged.
# Sweep mode: called on schedule; tags every merged-but-untagged PR —
# the fallback for the race where the event arrives before the merge.
#
# NOTE: neither pull_request:closed (this GitHub emits action
# "merged", an invalid trigger type) nor push to main (GITHUB_TOKEN
# events create no runs) can be used; workflow_run + schedule is the
# only mechanism that covers bot auto-merges.
name: tag-on-merge

on:
  workflow_call:
    inputs:
      head-sha:
        required: false
        type: string
      sweep:
        required: false
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            async function tagIfUntagged(repo, pr) {
              if (!pr.merged || !pr.merge_commit_sha) return false;
              const { data: commit } = await github.rest.git.getCommit({
                ...repo, commit_sha: pr.merge_commit_sha,
              });
              const d = new Date(commit.committer.date);
              const y = d.getUTCFullYear();
              const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
              const hh = String(d.getUTCHours()).padStart(2, '0');
              const mm = String(d.getUTCMinutes()).padStart(2, '0');
              const tag = repo.repo === 'sdk'
                ? `v0.${y}${doy}.${parseInt(hh + mm)}`
                : `v${y}.${doy}.${hh}${mm}`;
              try {
                await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
                return false;
              } catch {}
              await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: pr.merge_commit_sha,
              });
              core.info(`Tagged ${tag} at ${pr.merge_commit_sha} (PR #${pr.number})`);
              return true;
            }

            const repo = { ...context.repo };
            const sweep = ${{ inputs.sweep }};

            if (!sweep) {
              const headSha = '${{ inputs.head-sha }}';
              if (!headSha) { core.info('No head-sha — skipping'); return; }
              const { data: prs } = await github.rest.pulls.list({
                ...repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 5,
              });
              const pr = prs.find(p => p.head.sha === headSha);
              if (!pr) { core.info(`No PR for head ${headSha} — skipping`); return; }
              await tagIfUntagged(repo, pr);
              return;
            }

            // Sweep: every closed PR updated in the last 24h.
            const since = new Date(Date.now() - 24 * 3600 * 1000);
            let page = 1, done = false;
            while (!done) {
              const { data: prs } = await github.rest.pulls.list({
                ...repo, state: 'closed', sort: 'updated', direction: 'desc',
                per_page: 100, page,
              });
              if (!prs.length) break;
              for (const p of prs) {
                if (new Date(p.updated_at) < since) { done = true; break; }
                await tagIfUntagged(repo, p);
              }
              if (done || prs.length < 100) break;
              page++;
            }
            core.info('Sweep complete');
