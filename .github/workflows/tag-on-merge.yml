# ORG-WIDE TAG-ON-MERGE (reusable via workflow_call)
#
# For every merged PR without a CalVer tag:
#   1. Creates a CalVer tag at the merge commit.
#   2. Creates CHANGELOG/<calver>.md from the PR body (the body IS the changelog).
#
# Triggered by pull_request:closed (merged) or scheduled sweep.
name: tag-on-merge

on:
  workflow_call:

jobs:
  tag-and-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = { ...context.repo };

            async function processMergedPr(pr) {
              if (!pr.merged_at || !pr.merge_commit_sha) return;

              // Compute CalVer from merge commit time
              const { data: commit } = await github.rest.git.getCommit({
                ...repo, commit_sha: pr.merge_commit_sha,
              });
              const d = new Date(commit.committer.date);
              const y = d.getUTCFullYear();
              const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
              const hh = String(d.getUTCHours()).padStart(2, '0');
              const mm = String(d.getUTCMinutes()).padStart(2, '0');
              const tag = repo.repo === 'sdk'
                ? `v0.${y}${doy}.${parseInt(hh + mm)}`
                : `v${y}.${doy}.${hh}${mm}`;
              const calver = tag.replace(/^v/, '');

              // Skip if already tagged
              try {
                await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
                return;
              } catch {}

              // Create tag
              await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: pr.merge_commit_sha,
              });
              core.info(`Tagged ${tag} at ${pr.merge_commit_sha} (PR #${pr.number})`);

              // CHANGELOG content = the PR body itself (title + body). The
              // PR body IS the changelog; no separate section required.
              const body = (pr.body || '').trim();
              if (!body) {
                core.info(`PR #${pr.number} has no body — skipping CHANGELOG creation`);
                return;
              }

              const changelogPath = `CHANGELOG/${calver}.md`;
              const header = `# ${calver} — ${pr.title}\n\n`;
              const fullContent = header + body;
              const b64 = Buffer.from(fullContent).toString('base64');

              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...repo,
                  path: changelogPath,
                  message: `docs: add CHANGELOG ${calver} for PR #${pr.number}`,
                  content: b64,
                  branch: 'main',
                });
                core.info(`Created ${changelogPath}`);
              } catch (e) {
                core.warning(`Failed to create CHANGELOG: ${e.message}`);
              }
            }

            // Single-PR mode: triggered by pull_request:closed
            if (context.eventName === 'pull_request' && context.payload.pull_request) {
              const pr = context.payload.pull_request;
              if (pr.merged) {
                await processMergedPr(pr);
              }
              return;
            }

            // Sweep mode: scan recently merged PRs
            const since = new Date(Date.now() - 24 * 3600 * 1000);
            let page = 1, done = false;
            while (!done) {
              const { data: prs } = await github.rest.pulls.list({
                ...repo, state: 'closed', sort: 'updated', direction: 'desc',
                per_page: 100, page,
              });
              if (!prs.length) break;
              for (const p of prs) {
                if (new Date(p.updated_at) < since) { done = true; break; }
                try {
                  await processMergedPr(p);
                } catch (e) {
                  core.warning(`PR #${p.number}: ${e.message} — continuing`);
                }
              }
              if (done || prs.length < 100) break;
              page++;
            }
            core.info('Sweep complete');
