# ORG-WIDE TAG-ON-MERGE (reusable via workflow_call)
#
# Sweep mode only: scans closed PRs updated in the last 24h and tags
# every merged PR that lacks its CalVer tag.
#
# Why not event-driven: the workflow_run head_sha does not reliably
# match the PR's final head (the rename produces multiple commits), so
# a head-based lookup can miss; the sweep is robust by construction.
# NOTE: pull_request:closed never fires for auto-merges (the merge
# event action is "merged", an invalid trigger type), and push events
# from GITHUB_TOKEN create no runs — workflow_run is the only event
# that fires after a bot auto-merge.
name: tag-on-merge

on:
  workflow_call:

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = { ...context.repo };

            async function tagIfUntagged(pr) {
              if (!pr.merged || !pr.merge_commit_sha) return;
              const { data: commit } = await github.rest.git.getCommit({
                ...repo, commit_sha: pr.merge_commit_sha,
              });
              const d = new Date(commit.committer.date);
              const y = d.getUTCFullYear();
              const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
              const hh = String(d.getUTCHours()).padStart(2, '0');
              const mm = String(d.getUTCMinutes()).padStart(2, '0');
              const tag = repo.repo === 'sdk'
                ? `v0.${y}${doy}.${parseInt(hh + mm)}`
                : `v${y}.${doy}.${hh}${mm}`;
              try {
                await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
                return;
              } catch {}
              await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: pr.merge_commit_sha,
              });
              core.info(`Tagged ${tag} at ${pr.merge_commit_sha} (PR #${pr.number})`);
            }

            const since = new Date(Date.now() - 24 * 3600 * 1000);
            let page = 1, done = false;
            while (!done) {
              const { data: prs } = await github.rest.pulls.list({
                ...repo, state: 'closed', sort: 'updated', direction: 'desc',
                per_page: 100, page,
              });
              if (!prs.length) break;
              for (const p of prs) {
                if (new Date(p.updated_at) < since) { done = true; break; }
                await tagIfNewer(p);
              }
              if (done || prs.length < 100) break;
              page++;
            }
            core.info('Sweep complete');
