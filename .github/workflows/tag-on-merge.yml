# ORG-WIDE TAG-ON-MERGE (reusable via workflow_call)
#
# Called by a push-triggered dispatcher (every squash merge pushes a
# commit to main). Creates the CalVer release tag on the pushed sha.
#
# NOTE: the old pull_request:closed-based design never fired — this
# GitHub emits action "merged" (not "closed") for merged PRs, and
# "merged" is not a valid workflow trigger type.
name: tag-on-merge

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.sha }}';
            const d = new Date();
            const y = d.getUTCFullYear();
            const doy = String(Math.floor((d - new Date(y, 0, 0)) / 86400000)).padStart(3, '0');
            const hh = String(d.getUTCHours()).padStart(2, '0');
            const mm = String(d.getUTCMinutes()).padStart(2, '0');
            const tag = context.repo.repo === 'sdk'
              ? `v0.${y}${doy}.${parseInt(hh + mm)}`
              : `v${y}.${doy}.${hh}${mm}`;

            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} already exists — skipping`);
              return;
            } catch {}

            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${tag}`, sha: sha,
            });
            core.info(`Tagged ${tag} at ${sha}`);
