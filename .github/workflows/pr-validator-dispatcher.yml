# ORG-WIDE PR-VALIDATOR DISPATCHER — .github repo's own instance.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: validate
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    # SELF-GATING PIN (this PR only): main's composite errexit-dies on
    # "unstable status" (opencharly/.github#82 RCA) and this PR cannot pass
    # its own gate on main. The pin intentionally persists in the landed tree;
    # the body documents the follow-up PR that re-pins @main.
    uses: opencharly/.github/.github/workflows/pr-validator.yml@f0e1b9e15ee32a7855aed4eee391a382edc9d0ad
