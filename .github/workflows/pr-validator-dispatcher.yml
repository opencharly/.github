# ORG-WIDE PR-VALIDATOR DISPATCHER — .github repo's own instance.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: charly/pr-validator
    if: github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/pr-validator.yml
    with:
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
