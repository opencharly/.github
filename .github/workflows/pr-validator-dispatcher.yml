# ORG-WIDE PR-VALIDATOR DISPATCHER — .github repo's own instance.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: validate
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    # Reusable workflow ref must be the default branch or reachable from it.
    # The former self-gating pin (@f0e1b9e1, a dangling PR-head SHA) diverged
    # from main, so GitHub refused to expand this dispatcher (startup_failure,
    # 0 jobs) and no .github PR could get a verdict. Main's pr-validator.yml is
    # byte-identical to that pin, so @main is equivalent and expands.
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
