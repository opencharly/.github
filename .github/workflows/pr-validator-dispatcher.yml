# ORG-WIDE PR-VALIDATOR DISPATCHER — .github repo's own instance.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pr-validator:
    name: validate
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    # SELF-GATING PIN (reverted in the next commit of this same PR): main's
    # composite errexit-dies on "unstable status" (opencharly/.github#82 RCA);
    # this branch's composite (f0e1b9e) carries the resilient arming. Pin the
    # composite at this PR's head so the branch validates ITSELF with the fix.
    uses: opencharly/.github/.github/workflows/pr-validator.yml@f0e1b9e15ee32a7855aed4eee391a382edc9d0ad
    with:
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
